/* ===== GradeSync V28.1 UI Polish ===== */
:root{
  --accent:#9f1d22;
  --accent-dark:#741418;
  --accent-soft:#fff3f3;
  --surface:#ffffff;
  --surface-2:#fbfbfc;
  --bg:#f5f7fa;
  --text:#182230;
  --muted:#697386;
  --border:#e5e9f0;
  --shadow:0 10px 35px rgba(15,23,42,.07);
  --shadow-soft:0 4px 18px rgba(15,23,42,.05);
}
html{background:var(--bg)}
body{font-size:14px;letter-spacing:-.01em;background:
  radial-gradient(circle at 90% 0%,rgba(159,29,34,.035),transparent 26rem),
  var(--bg);
}
.app-shell{background:transparent}
.sidebar{
  width:auto;
  padding:20px 14px;
  background:linear-gradient(180deg,#991f24 0%,#7d171b 50%,#681216 100%);
  border-right:1px solid rgba(255,255,255,.08);
  box-shadow:12px 0 35px rgba(94,18,22,.08);
}
.brand{padding:4px 7px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand-mark{
  width:46px;height:46px;border-radius:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.26),rgba(255,255,255,.12));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);
}
.brand h1{font-size:21px;font-weight:950;letter-spacing:-.04em}
.brand small{font-size:11px;font-weight:750;color:#ffd8d8}
.nav{gap:6px}
.nav button{
  min-height:44px;padding:11px 13px;border-radius:13px;
  color:#f8dede;font-size:13px;font-weight:780;
  display:flex;align-items:center;gap:9px;
  transition:transform .15s ease,background .15s ease,color .15s ease;
}
.nav button:hover{transform:translateX(2px);background:rgba(255,255,255,.11)}
.nav button.active{
  color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.13));
  box-shadow:0 6px 20px rgba(0,0,0,.12),inset 0 0 0 1px rgba(255,255,255,.1);
}
.sidebar-footer{padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.main{background:transparent}
.topbar{
  height:78px;padding:0 26px;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 1px 0 rgba(15,23,42,.03);
}
.topbar h2{font-size:23px;font-weight:950;letter-spacing:-.04em}
.content{padding:26px}
.card{
  border:1px solid rgba(226,232,240,.9);
  border-radius:22px;
  box-shadow:var(--shadow-soft);
}
.card.pad{padding:22px}
.toolbar{margin-bottom:18px}
.btn{
  min-height:40px;padding:9px 14px;border-radius:12px;
  font-size:12px;font-weight:850;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(15,23,42,.06)}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  border-color:transparent;
  box-shadow:0 8px 18px rgba(159,29,34,.18);
}
.btn.primary:hover{background:linear-gradient(135deg,#a91f25,#721317)}
.input,.select,.textarea{
  min-height:43px;border-color:#dfe4eb;border-radius:13px;background:#fff;
  transition:border .15s ease,box-shadow .15s ease;
}
.input:focus,.select:focus,.textarea:focus{
  border-color:#bd7477;box-shadow:0 0 0 4px rgba(159,29,34,.07);
}
.table-wrap{
  border-radius:17px;border-color:#e6eaf0;background:#fff;box-shadow:0 3px 14px rgba(15,23,42,.03)
}
.table th{
  background:#f8fafc;color:#657083;font-size:10.5px;font-weight:900;
  padding:13px 12px;
}
.table td{padding:13px 12px}
.table tbody tr{transition:background .12s ease}
.table tbody tr:hover{background:#fffafa}
.badge{font-size:10.5px;padding:5px 9px}
.tabs{
  border:1px solid #e8ebf0;background:#f6f7f9;padding:5px;
}
.tabs button{min-height:38px}
.tabs button.active{box-shadow:0 4px 14px rgba(15,23,42,.07)}
.stat{
  border-radius:18px;
  background:linear-gradient(145deg,#fff,#fbfcfd);
}
.stat .label{text-transform:uppercase;letter-spacing:.05em;font-size:10px}
.stat .value{font-size:30px;letter-spacing:-.04em}
.split{gap:18px}
.candidate-list{
  background:#fff;border:1px solid var(--border);border-radius:18px;
  box-shadow:0 4px 18px rgba(15,23,42,.04)
}
.candidate-item{padding:14px 15px}
.candidate-item:hover{background:#fff7f7}
.candidate-item.active{background:#fff2f2;border-left-color:var(--accent)}
.score-box{background:#fff;border-radius:17px;box-shadow:0 3px 12px rgba(15,23,42,.03)}
.score-input{min-height:48px}
.notice{border-radius:14px}
.toast-root{right:26px;bottom:26px}
.toast{border-radius:18px;padding:15px 17px}
.modal-backdrop{backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.modal{border:1px solid rgba(255,255,255,.4);box-shadow:0 28px 90px rgba(15,23,42,.24)}
.login-wrap{
  background:
    radial-gradient(circle at 16% 12%,rgba(159,29,34,.1),transparent 24rem),
    radial-gradient(circle at 88% 82%,rgba(159,29,34,.05),transparent 30rem),
    #f8f9fb;
}
.login-card{
  border:1px solid #eceff3;border-radius:26px;background:rgba(255,255,255,.96);
  box-shadow:0 24px 70px rgba(15,23,42,.1)
}
.danger-strip{
  background:linear-gradient(90deg,#761418,#9c1d22);
  box-shadow:0 6px 18px rgba(127,29,29,.16)
}
.queue-row{padding:13px 14px}
.queue-row.current{background:#f0fdf7;border-left:4px solid #059669}
.offline-pill{padding:6px 10px}
@media(max-width:980px){
  .topbar{height:70px}
  .content{padding:18px}
  .app-shell{display:block}
}
@media(max-width:640px){
  .content{padding:12px}
  .topbar{padding:0 12px}
  .topbar h2{font-size:19px}
  .card.pad{padding:15px}
}

  </style>
</head>
