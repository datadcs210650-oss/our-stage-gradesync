        window._presenceToMillis=function(v){
            if(!v) return 0;
            if(typeof v.toMillis==='function') return v.toMillis();

            const d=new Date(v); return Number.isNaN(d.getTime())?0:d.getTime();

        window.getGraderPresenceState=function(code){
            const p=window._graderPresenceByCode?.[code];
            if(!p) return {state:'offline',label:'Chưa kết nối'};
            const age=Date.now()-Number(p.lastSeenMs||0);
            if(p.online===false) return {state:'offline',label:p.state==='logout'?'Đã đăng xuất':'Ngoại tuyến'};
            if(age>75000) return {state:'stale',label:'Mất kết nối'};
            return {state:'online',label:'Đang online'};
        };

            const s=window.getGraderPresenceState(code);
            const cls=s.state==='online'?'gs-presence-online':s.state==='stale'?'gs-presence-stale':'gs-presence-offline';
            const icon=s.state==='online'?'fa-circle-check':s.state==='stale'?'fa-wifi':'fa-circle-xmark';
            return `<span class="gs-presence-badge ${cls}" data-presence-code="${window.escapeHtml(code)}"><i class="fas ${icon}"></i>${window.escapeHtml(s.label)}</span>`;

        window.evaluateAdminPresenceAlerts=function(){
            if(!['Admin','SuperAdmin'].includes(window.currentUserData?.role)) return;
            Object.keys(window._graderPresenceByCode||{}).forEach(code=>{
                const s=window.getGraderPresenceState(code);

                if(s.state==='stale' && prev!=='stale') window.showToast(`⚠️ Mất kết nối với giám khảo ${code}.`,'error');
                if(s.state==='online' && prev && prev!=='online') window.showToast(`✓ Giám khảo ${code} đã kết nối lại.`);

                const byCode={};

                });

        // --- THÔNG BÁO REALTIME CHO ADMIN KHI GIÁM KHẢO NỘP BẢNG ĐIỂM ---
        window.stopAdminSubmissionNotifications = function() {
            if (window._adminSubmissionUnsub) {
                try { window._adminSubmissionUnsub(); } catch(e) {}
                window._adminSubmissionUnsub = null;
            }
            window._adminSubmissionNotificationReady = false;
            window._adminSubmissionIds = new Set();
        };

        window.startAdminSubmissionNotifications = function() {
            if (!window.currentUserData || !['Admin', 'SuperAdmin'].includes(window.currentUserData.role)) return;

            window.stopAdminSubmissionNotifications();
            window._adminSubmissionState = new Map();

            const q = window.query(window.collection(window.db, 'grader_verifications'));

            window._adminSubmissionUnsub = window.onSnapshot(q, (snapshot) => {
                // Lần snapshot đầu tiên chỉ ghi nhận trạng thái hiện tại.
                if (!window._adminSubmissionNotificationReady) {
                    snapshot.forEach(ds => {
                        const d = ds.data() || {};
                        window._adminSubmissionState.set(ds.id, !!d.isVerified);
                    });
                    window._adminSubmissionNotificationReady = true;
                    return;
                }

                snapshot.docChanges().forEach(change => {
                    const d = change.doc.data() || {};
                    const wasVerified = window._adminSubmissionState.get(change.doc.id) === true;
                    const isVerified = d.isVerified === true;

                    // Thông báo khi vừa nộp: document mới hoặc chuyển từ chưa nộp -> đã nộp.
                    if (isVerified && !wasVerified) {
                        const grader = d.graderName || d.graderCode || 'Giám khảo';
                        const groupName = d.groupName || d.groupId || 'nhóm thi';
                        const time = d.timestamp && d.timestamp.toDate
                            ? d.timestamp.toDate().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})
                            : new Date().toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});

                        window.showToast(
                            `<span class="font-black">Giám khảo đã nộp bảng điểm</span><br>${window.escapeHtml(String(grader))} • ${window.escapeHtml(String(groupName))}<br><span class="text-[10px] opacity-70">${time}</span>`,
                            'success'
                        );

                        // Nếu Admin đang mở màn hình giám sát, tải lại ngay để thấy "Đã nộp".
                        const main = document.getElementById('main-content');
                        if (main && typeof window.loadAdminLiveMonitor === 'function') {
                            const monitor = main.querySelector('.fa-shield-alt');
                            if (monitor) window.loadAdminLiveMonitor(main).catch(() => {});
                        }
                    }

                    window._adminSubmissionState.set(change.doc.id, isVerified);
                });
            }, (error) => {
                console.error('ADMIN SUBMISSION NOTIFICATION ERROR:', error);
            });
        };
        window.toggleSidebar = function(){ const mobile=window.matchMedia('(max-width:900px)').matches; if(mobile){ document.body.classList.toggle('gs-mobile-hidden'); } else { document.body.classList.toggle('gs-collapsed'); localStorage.setItem('gsSidebarCollapsed', document.body.classList.contains('gs-collapsed')); } };

        window.setAccent = function(c){ const map={red:['#991b1b','#7f1d1d'],blue:['#1d4ed8','#1e3a8a'],purple:['#6d28d9','#4c1d95'],green:['#047857','#065f46']}; const a=map[c]||map.red; document.documentElement.style.setProperty('--gs-primary',a[0]); document.documentElement.style.setProperty('--gs-primary2',a[1]); localStorage.setItem('gsAccent',c); document.querySelectorAll('.sidebar-gradient').forEach(x=>x.style.background=`linear-gradient(180deg,${a[0]} 0%,${a[1]} 100%)`); };
        (function(){ const t=localStorage.getItem('gsTheme')||'light'; window.setTheme(t); const a=localStorage.getItem('gsAccent')||'red'; window.setAccent(a); if(localStorage.getItem('gsSidebarCollapsed')==='true' && !matchMedia('(max-width:900px)').matches) document.body.classList.add('gs-collapsed'); })();

        // ===== V15: ĐĂNG NHẬP ỔN ĐỊNH CHO ADMIN + GIÁM KHẢO =====
        window._authFlow = null;
        window._lastInitAuthUid = null;

        window.normalizeRole = function(role){
            const r=String(role||'').trim().toLowerCase().replace(/\s+/g,'');
            if(r==='superadmin'||r==='superadministrator') return 'SuperAdmin';
            if(r==='admin'||r==='administrator') return 'Admin';
            if(r==='grader'||r==='judge'||r==='giamkhao') return 'Grader';
            return role || '';
        };
        window.isInactiveStatus = function(status){
            return String(status||'Active').trim().toLowerCase()==='inactive';
        };
        window.waitForAuthState = async function(predicate, timeoutMs=7000){
            const started=Date.now();
            while(Date.now()-started<timeoutMs){
                const u=window.auth.currentUser;
                if(predicate(u)) return u;
                await new Promise(r=>setTimeout(r,60));
            }
            return window.auth.currentUser;
        };
        window.getAllAdminMenuIds = function(){
            return (window.MENU_CONFIG||[]).filter(m=>m.roles?.includes('Admin')||m.roles?.includes('SuperAdmin')).map(m=>m.id);
        };

        // Tìm hồ sơ Admin theo nhiều kiểu dữ liệu cũ để không làm hỏng tài khoản đang dùng.
        window.resolveAdminProfile = async function(user){
            const email=String(user?.email||'').trim();
            const emailLower=email.toLowerCase();
            let found=null;

            // 1) Ưu tiên document users/{firebaseUid} nếu hệ thống đã chuẩn hóa theo UID.
            try{
                const snap=await window.getDoc(window.doc(window.db,'users',user.uid));
                if(snap.exists()) found={id:snap.id,...snap.data()};
            }catch(e){ console.warn('ADMIN UID PROFILE LOOKUP:',e); }

            // 2) Tương thích database cũ: document users có field email.
            if(!found && email){
                try{
                    const q=window.query(window.collection(window.db,'users'),window.where('email','==',email));
                    const sp=await window.getDocs(q);
                    if(!sp.empty) found={id:sp.docs[0].id,...sp.docs[0].data()};
                }catch(e){ console.warn('ADMIN EMAIL PROFILE LOOKUP:',e); }
            }

            // 3) Email trong dữ liệu cũ có thể khác chữ hoa/thường. Fallback đọc users và so sánh lowercase.
            if(!found && emailLower){
                try{
                    const sp=await window.getDocs(window.collection(window.db,'users'));
                    const d=sp.docs.find(x=>String(x.data()?.email||'').trim().toLowerCase()===emailLower);
                    if(d) found={id:d.id,...d.data()};
                }catch(e){ console.warn('ADMIN LEGACY PROFILE LOOKUP:',e); }
            }

            // V27 SECURITY: không tự nâng mọi tài khoản Email/Password thành SuperAdmin.
            // Tài khoản quản trị phải có hồ sơ users với role Admin/SuperAdmin.
            if(!found){
                throw new Error('ADMIN_PROFILE_MISSING');
            }

            if(window.isInactiveStatus(found.status)) throw new Error('ADMIN_DISABLED');
            let role=window.normalizeRole(found.role);
            // Tương thích bản rất cũ: tài khoản email Admin chưa có field role.
            if(!role && found.email) role='SuperAdmin';
            if(!['Admin','SuperAdmin'].includes(role)) throw new Error('ADMIN_ROLE_INVALID');
            return {
                ...found,
                email:found.email||email,
                name:found.name||email||'Quản trị viên',
                role,
                status:found.status||'Active',
                assignedGroups:Array.isArray(found.assignedGroups)?found.assignedGroups:[],
                allowedMenus:Array.isArray(found.allowedMenus)&&found.allowedMenus.length?found.allowedMenus:window.getAllAdminMenuIds(),
                code:'ADMIN'
            };
        };

        window.completeAdminLogin = async function(user, showSuccess=false){
            if(!user || user.isAnonymous) return false;
            try{
                const profile=await window.resolveAdminProfile(user);
                window.currentUserData={...profile,code:'ADMIN'};
                localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));
                // V27 SECURITY: tạo admin_sessions trước khi mở ứng dụng.
                // Firestore Rules dùng session này để xác minh đúng hồ sơ Admin/SuperAdmin thay vì tin mọi Email Auth.
                await window.setDoc(window.doc(window.db,'admin_sessions',user.uid),{
                    authUid:user.uid,
                    profileId:profile.id,
                    email:String(user.email||profile.email||'').trim(),
                    role:profile.role,
                    lastSeen:window.serverTimestamp(),
                    updatedAt:window.serverTimestamp()
                },{merge:true});
                window._lastInitAuthUid=user.uid;
                window.initApp();
                window.startAdminSubmissionNotifications?.();
                if(profile._authFallback){
                    console.warn('Admin đăng nhập bằng Firebase Auth fallback vì chưa có hồ sơ users tương ứng.');
                }
                if(showSuccess) window.showToast('Đăng nhập quản trị thành công!');
                return true;
            }catch(e){
                console.error('ADMIN PROFILE ERROR:',e);
                window.showLoading(false);
                if(e.message==='ADMIN_DISABLED') window.showToast('Tài khoản quản trị đã bị khóa.','error');
                else if(e.message==='ADMIN_ROLE_INVALID') window.showToast('Tài khoản Firebase này không có vai trò quản trị.','error');
                else if(e.message==='ADMIN_PROFILE_MISSING') window.showToast('Tài khoản Firebase chưa có hồ sơ Admin/SuperAdmin trong Firestore users.','error');
                else window.showToast('Không thể tải hồ sơ quản trị: '+(e.message||e.code||'Lỗi không xác định'),'error');
                try{await window.signOut(window.auth);}catch(_){}
                return false;
            }
        };

        window.restoreGraderSession = async function(user){
            if(!user?.isAnonymous) return false;
            const s=localStorage.getItem('gradeSyncSession');
            if(!s) return false;
            try{
                const parsed=JSON.parse(s);
                if(parsed.role!=='Grader'||!parsed.code) return false;
                const code=String(parsed.code).trim().toUpperCase();
                const q=window.query(window.collection(window.db,'users'),window.where('code','==',code),window.where('role','==','Grader'));
                const sp=await window.getDocs(q);
                if(sp.empty) return false;
                const d=sp.docs[0].data();
                if(window.normalizeRole(d.role)!=='Grader'||window.isInactiveStatus(d.status)) return false;
                window.currentUserData={id:sp.docs[0].id,...d,role:'Grader',status:d.status||'Active',code};
                localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));
                // Gia hạn grader_sessions sau reload; nếu Rules cũ chưa hỗ trợ thì không làm kẹt login.
                try{await window.syncGraderSession(true,'restore');}catch(e){console.warn('RESTORE GRADER SESSION:',e);}
                window._lastInitAuthUid=user.uid;
                window._seedAssignedGroupPlaceholders?.();
                window.initApp();
                return true;
            }catch(e){
                console.warn('Không khôi phục được phiên giám khảo:',e);
                return false;
            }
        };

        onAuthStateChanged(window.auth, async (user) => {
            // Trong lúc nút đăng nhập đang chủ động chuyển loại tài khoản, handler riêng sẽ hoàn tất luồng.
            if(window._authFlow==='admin-login'||window._authFlow==='grader-login'||window._authFlow==='switching') return;

            if(user){

        window.handleLoginEmail = async function() {
            const e=String(document.getElementById('login-email')?.value||'').trim();
            const p=document.getElementById('login-password')?.value||'';
            if(!e||!p) return window.showToast('Nhập đủ Email và Mật khẩu!','error');
            if(navigator.onLine===false) return window.showToast('Thiết bị đang mất mạng. Không thể đăng nhập quản trị.','error');

            window._authFlow='admin-login';
            window.showLoading(true,'Đang đăng nhập quản trị...');
            try{
                // Nếu trình duyệt đang giữ phiên anonymous của BGK thì thoát hẳn trước khi đăng nhập Admin.
                if(window.auth.currentUser?.isAnonymous){
                    try{await window.syncGraderSession(false,'switch-to-admin');}catch(_){}
                    await window.signOut(window.auth);
                    await window.waitForAuthState(u=>!u,4000);
                }
                localStorage.removeItem('gradeSyncSession');
                const cred=await window.signInWithEmailAndPassword(window.auth,e,p);
                await window.waitForAuthState(u=>!!u&&!u.isAnonymous,5000);
                const ok=await window.completeAdminLogin(cred.user,true);
                if(!ok) throw new Error('Không thể hoàn tất đăng nhập quản trị.');
            }catch(err){
                console.error('ADMIN LOGIN ERROR:',err);
                window.showLoading(false);
                const messages={
                    'auth/invalid-email':'Email không hợp lệ.',
                    'auth/invalid-credential':'Email hoặc mật khẩu không đúng.',
                    'auth/wrong-password':'Mật khẩu không đúng.',
                    'auth/user-not-found':'Tài khoản chưa tồn tại trong Firebase Authentication.',
                    'auth/operation-not-allowed':'Firebase chưa bật phương thức Email/Password.',
                    'auth/too-many-requests':'Có quá nhiều lần thử. Vui lòng thử lại sau.',
                    'auth/network-request-failed':'Không thể kết nối Firebase. Hãy kiểm tra Internet.'
                };

                    window.showToast(messages[err.code]||('Không đăng nhập được Admin: '+(err.message||err.code||'Lỗi không xác định')),'error');

        window.handleLoginCode = async function() {
            const c=String(document.getElementById('login-code')?.value||'').trim().toUpperCase();
            if(!c) return window.showToast('Nhập mã giám khảo!','error');
            if(navigator.onLine===false) return window.showToast('Thiết bị đang mất mạng. Không thể xác thực mã giám khảo.','error');

            window._authFlow='grader-login';
            window.showLoading(true,'Đang xác thực giám khảo...');
            try{
                // Nếu trình duyệt đang giữ Admin hoặc một anonymous session cũ, chuyển phiên sạch sẽ.
                if(window.auth.currentUser){
                    try{
                        if(window.currentUserData?.role==='Grader') await window.syncGraderSession(false,'switch-account');
                    }catch(_){}
                    await window.signOut(window.auth);
                    await window.waitForAuthState(u=>!u,4000);
                }
                localStorage.removeItem('gradeSyncSession');

                const cred=await window.signInAnonymously(window.auth);
                const authUser=await window.waitForAuthState(u=>!!u&&u.isAnonymous,5000);
                if(!authUser?.isAnonymous) throw new Error('Không tạo được phiên Firebase Anonymous.');

                const q=window.query(window.collection(window.db,'users'),window.where('code','==',c),window.where('role','==','Grader'));
                const sp=await window.getDocs(q);
                if(sp.empty) throw new Error('GRADER_NOT_FOUND');
                const d=sp.docs[0].data();
                if(window.normalizeRole(d.role)!=='Grader') throw new Error('NOT_GRADER');
                if(window.isInactiveStatus(d.status)) throw new Error('GRADER_DISABLED');

                window.currentUserData={
                    id:sp.docs[0].id,
                    ...d,
                    role:'Grader',
                    status:d.status||'Active',
                    assignedGroups:Array.isArray(d.assignedGroups)?d.assignedGroups:[],
                    code:c
                };
                localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));

                const sessionOK=await window.syncGraderSession(true,'login');
                if(!sessionOK) throw new Error('GRADER_SESSION_FAILED');
                window._lastInitAuthUid=cred.user.uid;
                window._seedAssignedGroupPlaceholders?.();
                window.initApp();
                window.showToast('Đăng nhập giám khảo thành công!');
            }catch(ex){
                console.error('GRADER LOGIN ERROR:',ex);
                window.showLoading(false);
                let msg='Không thể vào hệ thống: '+(ex.code||ex.message||'Lỗi không xác định');
                if(ex.message==='GRADER_NOT_FOUND') msg='Mã giám khảo không tồn tại.';
                else if(ex.message==='NOT_GRADER') msg='Mã này không phải tài khoản giám khảo.';
                else if(ex.message==='GRADER_DISABLED') msg='Thẻ giám khảo đang bị khóa.';
                else if(ex.message==='GRADER_SESSION_FAILED') msg='Không thể tạo phiên giám khảo. Hãy cập nhật Firestore Rules V27.';
                else if(ex.code==='auth/operation-not-allowed') msg='Firebase chưa bật Anonymous Authentication.';
                else if(ex.code==='auth/network-request-failed') msg='Không thể kết nối Firebase. Hãy kiểm tra Internet.';
                window.showToast(msg,'error');
                try{await window.signOut(window.auth);}catch(_){}
                window.currentUserData=null;
                localStorage.removeItem('gradeSyncSession');
            }finally{
                window._authFlow=null;
            }
        };

        window.toMillisSafe=function(v){
            if(v==null) return null;
            if(typeof v==='number') return v;
            if(v instanceof Date) return v.getTime();
            if(typeof v==='string'){const n=Date.parse(v);return Number.isNaN(n)?null:n;}
            if(typeof v.toMillis==='function') return v.toMillis();
            if(typeof v.seconds==='number') return v.seconds*1000 + Math.floor((v.nanoseconds||0)/1000000);
            return null;
        };
        // ===== QUYỀN NHÓM V19 =====
        // Admin đã phân quyền nhóm nào thì BGK LUÔN thấy tên nhóm đó trong giao diện.
        // Không còn tính năng Ẩn/Hiện nhóm. Chế độ Thủ công/Tự động chỉ quyết định
        // thời điểm được xem thí sinh và nhập điểm, KHÔNG quyết định việc thấy tên nhóm.
        window.groupVisibilityEnabled=function(g){ return !!g; }; // tương thích code cũ
        window.isGroupPublishedForGrader=function(g){
            if(!g) return false;
            const now=Date.now();
            const end=window.toMillisSafe(g.endTime) ?? window.toMillisSafe(g.closeAt) ?? window.toMillisSafe(g.publishUntil) ?? Infinity;
            if(now>end) return false;
            if(g.openMode==='auto'){
                const start=window.toMillisSafe(g.startTime) ?? window.toMillisSafe(g.openAt) ?? window.toMillisSafe(g.publishAt);
                return start!=null && now>=start && now<=end;
            }
            return g.isManuallyOpened===true;
        };
        window.getPublicationStatus=function(g){
            if(!g) return {state:'off',label:'Lỗi cấu hình',detail:'Không tìm thấy nhóm.'};
            const now=Date.now();
            const end=window.toMillisSafe(g.endTime) ?? window.toMillisSafe(g.closeAt) ?? Infinity;
            if(now>end) return {state:'off',label:'Đã khóa',detail:'BGK vẫn thấy tên nhóm nhưng không thể xem thí sinh hoặc chấm điểm.'};
            if(g.openMode==='auto'){
                const start=window.toMillisSafe(g.startTime) ?? window.toMillisSafe(g.openAt);
                if(start!=null && now<start) return {state:'wait',label:'Chờ giờ mở',detail:`Nhóm luôn hiện với BGK đã phân quyền. Dữ liệu chấm tự mở lúc ${new Date(start).toLocaleString('vi-VN')}.`};
                return {state:'on',label:'Đang mở',detail:'Nhóm đang mở tự động. BGK được xem thí sinh và chấm điểm.'};
            }
            return g.isManuallyOpened===true
                ? {state:'on',label:'Đang mở',detail:'Nhóm thủ công đang mở. BGK được xem thí sinh và chấm điểm.'}
                : {state:'wait',label:'Đang đóng',detail:'BGK đã phân quyền vẫn thấy nhóm. Bấm Mở Ngay để cho phép xem thí sinh và chấm điểm.'};
        };
        // Giữ publication index chỉ để tương thích dữ liệu cũ. V19 không dùng nó để ẩn nhóm.
        window.buildPublicationMeta=function(groupId,g){
            const auto=g.openMode==='auto';
            const startMs=window.toMillisSafe(g.startTime) ?? window.toMillisSafe(g.openAt) ?? window.toMillisSafe(g.publishAt);
            const endMs=window.toMillisSafe(g.endTime) ?? window.toMillisSafe(g.closeAt) ?? window.toMillisSafe(g.publishUntil);
            const start=startMs!=null?new Date(startMs):null;
            const end=endMs!=null?new Date(endMs):null;
            return {
                groupId,
                name:g.name||'',
                openMode:auto?'auto':'manual',
                visibleToGraders:true,
                publishEnabled:true,
                openAt:start && !Number.isNaN(start.getTime())?start:null,
                closeAt:end && !Number.isNaN(end.getTime())?end:null,
                publishAt:start && !Number.isNaN(start.getTime())?start:null,
                publishUntil:end && !Number.isNaN(end.getTime())?end:null,
                isOpen:auto?false:(g.isManuallyOpened===true),
                isPublished:auto?false:(g.isManuallyOpened===true),
                updatedAt:window.serverTimestamp(),
                schemaVersion:3
            };
        };
        window.syncPublicationIndexForGroup=async function(groupId,g){
            const meta=window.buildPublicationMeta(groupId,g);
            await window.setDoc(window.doc(window.db,'group_publication_index',groupId),meta,{merge:true});
            return meta;
        };
        window.repairPublicationIndexes=async function(){
            if(!['Admin','SuperAdmin'].includes(window.currentUserData?.role)) return;
            try{
                const snap=await window.getDocs(window.collection(window.db,'competition_groups'));
                if(snap.empty) return;
                const batch=window.writeBatch(window.db); let count=0;
                snap.forEach(ds=>{
                    const g=ds.data();
                    const openMs=(g.openMode==='auto')?(window.toMillisSafe(g.startTime) ?? window.toMillisSafe(g.openAt) ?? window.toMillisSafe(g.publishAt)):null;
                    const closeMs=window.toMillisSafe(g.endTime) ?? window.toMillisSafe(g.closeAt) ?? window.toMillisSafe(g.publishUntil);
                    const openAt=openMs!=null?new Date(openMs):null;
                    const closeAt=closeMs!=null?new Date(closeMs):null;
                    const compat={
                        visibleToGraders:true,
                        publishEnabled:true,
                        visibilityExplicitlySet:false,
                        openAt:openAt && !Number.isNaN(openAt.getTime())?openAt:null,
                        closeAt:closeAt && !Number.isNaN(closeAt.getTime())?closeAt:null,
                        publicationUpdatedAt:window.serverTimestamp()
                    };
                    batch.set(window.doc(window.db,'competition_groups',ds.id),compat,{merge:true});
                    batch.set(window.doc(window.db,'group_publication_index',ds.id),window.buildPublicationMeta(ds.id,{...g,...compat}),{merge:true});
                    count+=2;
                });
                if(count) await batch.commit();
            }catch(e){ console.warn('V19 GROUP MIGRATION ERROR:',e); }
        };
        // Tính năng Ẩn nhóm đã bị loại bỏ. Hàm cũ chỉ giữ tương thích nếu code cũ gọi nhầm.
        window.setGroupVisibility=async function(groupId){
            try{
                const ref=window.doc(window.db,'competition_groups',groupId);
                await window.setDoc(ref,{visibleToGraders:true,publishEnabled:true,visibilityExplicitlySet:false},{merge:true});
                window.showToast('V19: Nhóm được phân quyền luôn hiển thị với BGK.');
            }catch(e){window.showToast('Không thể đồng bộ nhóm: '+(e.message||e.code),'error');}
        };
        window.toggleGroupPublication=(groupId)=>window.setGroupVisibility(groupId);
        window.renderPublicationControl=function(){ return ''; };

        // ===== CONTENT / INTERVIEW CONFIGURATION - V2 =====
        // Cấu trúc mới: tiêu chí = bảng động; phỏng vấn = tài liệu theo từng "Dạng".
        // Tương thích dữ liệu V1 cũ và tự chuẩn hóa khi mở.
        window.contentUid = function(prefix='id'){ return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); };
        window.defaultScoringColumns = function(){ return [
            {key:'stt',label:'STT',type:'number'},
            {key:'criterion',label:'TIÊU CHÍ CHẤM ĐIỂM',type:'text'},
            {key:'content',label:'NỘI DUNG',type:'textarea'},
            {key:'weight',label:'TRỌNG SỐ',type:'percent'},
            {key:'maxScore',label:'ĐIỂM TỐI ĐA',type:'number'},
            {key:'note',label:'GHI CHÚ',type:'textarea'}
        ]; };
        window.normalizeGroupContent = function(g){
            const cfg=g&&g.contentConfig?g.contentConfig:{};
            const sc=cfg.scoringContent||{}, iv=cfg.interviewContent||{};
            let columns=Array.isArray(sc.columns)&&sc.columns.length?sc.columns:window.defaultScoringColumns();
            let rows=[];
            if(Array.isArray(sc.rows)) rows=sc.rows.map((r,i)=>{
                if(r.cells) return {id:r.id||window.contentUid('r'),cells:{...r.cells}};
                const cells={stt:String(i+1),criterion:r.name||r.criterion||'',content:r.content||'',weight:r.weight!=null?r.weight:'',maxScore:r.maxScore!=null?r.maxScore:'',note:r.note||''};
                Object.keys(r).forEach(k=>{ if(!['id','name','criterion','content','weight','maxScore','note','order'].includes(k) && !cells[k]) cells[k]=r[k]; });
                return {id:r.id||window.contentUid('r'),cells};
            });
            let groups=[];
            if(Array.isArray(iv.groups)) groups=iv.groups.map((g,i)=>({id:g.id||window.contentUid('type'),title:g.title||`Dạng ${i+1}`,description:g.description||'',questions:Array.isArray(g.questions)?g.questions.map((q,j)=>({id:q.id||window.contentUid('q'),text:q.text||q.question||'',note:q.note||''})):[]}));
            else if(Array.isArray(iv.questions)&&iv.questions.length) {
                const grouped={};
                iv.questions.forEach((q,i)=>{ const title=q.type||q.category||'Dạng câu hỏi'; if(!grouped[title]) grouped[title]={id:window.contentUid('type'),title,description:'',questions:[]}; grouped[title].questions.push({id:q.id||window.contentUid('q'),text:q.question||q.text||'',note:q.note||''}); });
                groups=Object.values(grouped);
            }
            return {
                scoringContent:{enabled:sc.enabled===true,mode:sc.mode==='before'?'before':'group',title:sc.title||'TIÊU CHÍ CHẤM ĐIỂM',columns,rows},
                interviewContent:{enabled:iv.enabled===true,mode:iv.mode==='before'?'before':'group',title:iv.title||'CÂU HỎI PHỎNG VẤN',groups}
            };
        };
        window.getSectionAccess=function(groupInfo,sectionKey){
            const cfg=window.normalizeGroupContent(groupInfo), sec=cfg[sectionKey];
            if(!sec.enabled)return {enabled:false,open:false,text:'Chưa bật'};
            const now=Date.now(), end=window.toMillisSafe?.(groupInfo.endTime) ?? window.toMillisSafe?.(groupInfo.closeAt) ?? null;
            if(end&&now>end)return {enabled:true,open:false,text:'Đã đóng'};
            if(sec.mode==='before')return {enabled:true,open:true,text:'Được mở trước giờ chấm'};

        };
        // ===== EDITOR NỘI DUNG V2 - bản sửa thao tác Admin =====
        window.scoringTypeInput=function(col,val){

            const limits=col.type==='percent'?' min="0" max="100" step="0.01"':'';

        };
        window.renderScoringEditor=function(cfg){
            const cols=(cfg.scoringContent.columns||[]).map((c,i)=>({
                key:c.key||window.normalizeKey(c.label||`cot_${i+1}`)+`_${i}`,

                type:c.type||((i===2||i===5)?'textarea':(i===0||i===3||i===4?'number':'text'))
            }));

            const head=cols.map((c,i)=>`<th class="gs-edit-th" data-col-index="${i}"><div class="gs-th-wrap"><input class="gs-col-name" data-index="${i}" data-key="${window.escapeHtml(c.key)}" value="${window.escapeHtml(c.label)}"><button type="button" class="gs-icon-btn" title="Xóa cột" data-action="remove-column" data-index="${i}"><i class="fas fa-times"></i></button></div></th>`).join('');
            const body=rows.map((r,i)=>`<tr class="gs-edit-row" data-id="${window.escapeHtml(r.id||window.contentUid('r'))}">${cols.map((c,j)=>`<td>${j===0?`<div class="gs-stt-wrap">${window.scoringTypeInput(c,r.cells?.[c.key]??(j===0?i+1:''))}<button type="button" class="gs-row-delete" data-action="remove-row" title="Xóa dòng"><i class="fas fa-trash"></i></button></div>`:window.scoringTypeInput(c,r.cells?.[c.key]??'')}</td>`).join('')}</tr>`).join('');
            return `<div class="gs-table-toolbar"><div><b>Bảng tiêu chí chấm điểm</b><span id="gs-sc-count"> • ${rows.length} dòng • ${cols.length} cột</span></div><div class="flex gap-2 flex-wrap"><button type="button" class="gs-mini-btn gs-mini-blue" data-action="add-column"><i class="fas fa-columns"></i> Thêm cột</button><button type="button" class="gs-mini-btn gs-mini-red" data-action="add-row"><i class="fas fa-plus"></i> Thêm dòng</button></div></div><div class="overflow-auto border rounded-2xl"><table class="gs-editor-table"><thead><tr>${head}</tr></thead><tbody id="gs-scoring-table-body">${body}</tbody></table></div><div class="gs-helper">💡 <b>Thao tác:</b> bấm vào ô để sửa • <b>＋ Thêm dòng</b> để thêm một hàng • <b>＋ Thêm cột</b> để thêm trường mới • nút 🗑 ở tiêu đề để xóa cột.</div>`;
        };
        window.refreshScoringRowNumbers=function(){
            const body=document.getElementById('gs-scoring-table-body'); if(!body)return;
            const cols=[...document.querySelectorAll('.gs-col-name')];
            const sttIndex=cols.findIndex(x=>/^(stt|số thứ tự)$/i.test((x.value||'').trim()));
            if(sttIndex<0)return;
            body.querySelectorAll('tr.gs-edit-row').forEach((tr,i)=>{const cell=tr.cells[sttIndex]; if(cell){const inp=cell.querySelector('.gs-cell'); if(inp) inp.value=i+1; else cell.textContent=i+1;}});
        };
        window.updateScoringEditorCount=function(){
            const body=document.getElementById('gs-scoring-table-body'); const count=document.getElementById('gs-sc-count');
            if(count&&body)count.textContent=` • ${body.querySelectorAll('tr.gs-edit-row').length} dòng • ${document.querySelectorAll('.gs-col-name').length} cột`;
        };
        window.addScoringRow=function(){
            const body=document.getElementById('gs-scoring-table-body'); if(!body){window.showToast('Không tìm thấy bảng tiêu chí.','error');return;}
            const cols=[...document.querySelectorAll('.gs-col-name')].map((el,i)=>({key:el.dataset.key||window.normalizeKey(el.value||`cot_${i+1}`)+`_${i}`,label:el.value.trim()||`Cột ${i+1}`,type:(i===2||i===5)?'textarea':(i===0||i===3||i===4?'number':'text')}));

        window.normalizeKey=function(v){let x=(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');return x||window.contentUid('col');};
        window.addScoringColumn=function(){

            const name=window.prompt('Tên cột mới:','GHI CHÚ MỚI'); if(name===null)return;

            const th=document.createElement('th'); th.className='gs-edit-th'; th.dataset.colIndex=index;
            th.innerHTML=`<div class="gs-th-wrap"><input class="gs-col-name" data-index="${index}" data-key="${window.escapeHtml(key)}" value="${window.escapeHtml(label)}"><button type="button" class="gs-icon-btn" title="Xóa cột" data-action="remove-column" data-index="${index}"><i class="fas fa-times"></i></button></div>`;
            table.tHead.rows[0].appendChild(th);
            table.tBodies[0].querySelectorAll('tr.gs-edit-row').forEach(tr=>{const td=document.createElement('td');td.innerHTML=window.scoringTypeInput({key,type:'text'},'');tr.appendChild(td);});
            window.updateScoringEditorCount();
        };
        window.removeScoringColumn=function(index){
            const table=document.querySelector('.gs-editor-table'); if(!table)return;

        window.addInterviewType=function(){

        window.renderInterviewEditor=function(cfg){

        };
        // Dùng event delegation để các nút vừa tạo động luôn hoạt động ổn định.
        window.bindContentEditorEvents=function(){
            const modal=document.getElementById('custom-modal-box'); if(!modal||modal.dataset.gsEvents==='1')return;

                if(action==='remove-question'){

                return;
            }
            window.showLoading(true, "Đang đọc file...");
            try {
                const buffer = await f.arrayBuffer();
                const wb = window.XLSX.read(new Uint8Array(buffer), {
                    type: "array",
                    cellDates: true,
                    raw: false,
                    defval: ""
                });
                if (!wb.SheetNames || !wb.SheetNames.length) throw new Error("File không có sheet dữ liệu.");
                const ws = wb.Sheets[wb.SheetNames[0]];
                const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false });
                if (!rows.length) throw new Error("File không có dữ liệu.");

                const clean = v => String(v ?? "")
                    .replace(/^\uFEFF/, "")
                    .replace(/[\u00A0\u200B]/g, " ")
                    .trim();
                const normalize = v => clean(v)
                    .toLowerCase()
                    .normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/đ/g, "d")
                    .replace(/[^a-z0-9]+/g, "")
                    .trim();

                // Tìm dòng tiêu đề trong 10 dòng đầu thay vì bắt buộc dòng 1.
                let headerIndex = -1;
                let bestScore = 0;
                for (let i = 0; i < Math.min(rows.length, 10); i++) {
                    const hs = rows[i].map(normalize);
                    const score = hs.reduce((n, h) => n + (["hoten", "hovaten", "name", "maso", "sbd", "code", "madoanhnghiep"].includes(h) ? 1 : 0), 0);
                    if (score > bestScore) { bestScore = score; headerIndex = i; }
                }
                if (headerIndex < 0 || bestScore === 0) {
                    throw new Error("Không tìm thấy cột Họ tên/Mã số. Hãy dùng cột 'Họ tên' và 'Mã số'.");
                }

                const headers = rows[headerIndex].map((h, i) => clean(h) || `Cột ${i + 1}`);
                const keyIndex = {};
                headers.forEach((h, i) => { keyIndex[normalize(h)] = i; });
                const findCol = names => {
                    for (const n of names) {
                        const i = keyIndex[normalize(n)];
                        if (i !== undefined) return i;
                    }
                    return -1;
                };
                const nameCol = findCol(["Họ tên", "Họ và tên", "Ho ten", "Ho va ten", "Name", "Tên thí sinh", "Thi sinh"]);
                const codeCol = findCol(["Mã số", "Mã SBD", "SBD", "Ma so", "Ma SBD", "Code", "ID"]);
                const groupCol = findCol(["Nhóm thi", "Nhóm", "Group", "Group ID"]);
                if (nameCol < 0) throw new Error("Thiếu cột Họ tên.");

                const reserved = new Set([nameCol, codeCol, groupCol].filter(i => i >= 0));
                const parsed = [];
                const skipped = [];
                for (let r = headerIndex + 1; r < rows.length; r++) {
                    const row = rows[r] || [];
                    const name = clean(row[nameCol]);
                    const code = codeCol >= 0 ? clean(row[codeCol]) : "";
                    if (!name && !code) continue;
                    if (!name) { skipped.push(r + 1); continue; }
                    const extraData = {};
                    headers.forEach((h, i) => {
                        if (reserved.has(i)) return;
                        const value = clean(row[i]);
                        if (value !== "") extraData[h] = value;
                    });
                    parsed.push({ code, name, extraData, sourceGroup: groupCol >= 0 ? clean(row[groupCol]) : "" });
                }
                if (!parsed.length) throw new Error("Không đọc được thí sinh nào từ file.");

                window._tE = parsed;
                const groupOptions = groupEntries.map(([id, g]) => `<option value="${id}">${window.escapeHtml(g.name || id)}</option>`).join("");
                let preview = "";
                parsed.slice(0, 5).forEach(x => {
                    const extra = Object.values(x.extraData).join(", ").substring(0, 50);
                    preview += `<tr class="border-b border-gray-100"><td class="p-2 text-gray-500">${window.escapeHtml(x.code || "-")}</td><td class="p-2 font-bold">${window.escapeHtml(x.name)}</td><td class="p-2 text-gray-400 italic">${window.escapeHtml(extra || "-")}</td></tr>`;
                });
                if (parsed.length > 5) preview += `<tr><td colspan="3" class="p-2 text-center italic text-red-600 bg-red-50 text-[10px]">...và ${parsed.length - 5} thí sinh khác</td></tr>`;
                const skipNote = skipped.length ? `<p class="text-[10px] text-amber-600 mt-2">Đã bỏ qua ${skipped.length} dòng thiếu Họ tên.</p>` : "";
                document.getElementById('custom-modal-box').innerHTML = `
                    <h3 class="text-base font-black mb-4"><i class="fas fa-file-import text-emerald-600 mr-2"></i>Nhập ${parsed.length} Thí sinh</h3>
                    <label class="text-[10px] font-bold text-gray-500 uppercase">Chọn Nhóm thi</label>
                    <select id="i-t-g" class="w-full border p-3 rounded-xl text-xs font-bold text-red-800 bg-red-50 mb-4 outline-none">${groupOptions}</select>
                    <div class="max-h-48 overflow-auto custom-scrollbar mb-2 border rounded-lg"><table class="w-full text-[10px] text-left"><thead class="bg-gray-100 sticky top-0"><tr><th class="p-2">Mã số</th><th class="p-2">Họ tên</th><th class="p-2">Thông tin bổ sung</th></tr></thead><tbody>${preview}</tbody></table></div>
                    ${skipNote}
                    <div class="flex justify-end gap-2 mt-4"><button onclick="window.closeCustomModal();" class="bg-gray-100 px-4 py-2 rounded-lg text-xs font-bold btn-press">Hủy</button><button onclick="window.confirmImportExcel()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md btn-press">Nhập ${parsed.length} thí sinh</button></div>`;
                window.openModal();
            } catch (err) {
                console.error("Lỗi nhập Excel:", err);
                window.showToast("Lỗi đọc file: " + (err.message || "Không xác định"), "error");
            } finally {
                window.showLoading(false);
            }
        };

        window.confirmImportExcel = async function() {
            const targetGroupId = document.getElementById('i-t-g')?.value;
            const parsedCands = Array.isArray(window._tE) ? window._tE : [];
            if (!targetGroupId || !parsedCands.length) {
                window.showToast("Chưa có dữ liệu để nhập.", "error");
                return;
            }
            window.closeCustomModal();
            window.showLoading(true, `Đang nhập ${parsedCands.length} thí sinh...`);
            try {
                let count = 0;
                for (const c of parsedCands) {
                    await window.addDoc(window.collection(window.db, "candidates"), {
                        groupId: targetGroupId,
                        code: window.cleanTextForStore(c.code),
                        name: window.cleanTextForStore(c.name),
                        extraData: c.extraData || {},
                        isPresent: false,
                        createdAt: new Date()
                    });
                    count++;
                }
                window._tE = [];
                const input = document.getElementById('e-f');
                if (input) input.value = '';
                window.showToast(`Nhập thành công ${count} thí sinh!`);
                if (typeof window.fRC === 'function') await window.fRC();
            } catch (e) {
                console.error("Lỗi lưu thí sinh:", e);
                window.showToast("Lỗi lưu dữ liệu: " + (e.message || "Không xác định"), "error");
            } finally {
                window.showLoading(false);
            }
        };

        // ===== REALTIME CONTROL BUS V19 =====
        // Nguồn sự thật của trạng thái nhóm là competition_groups.
        // BGK được phân quyền luôn được phép nghe document nhóm (chỉ metadata/cấu hình),
        // nhưng chỉ được đọc candidates/scores khi nhóm thực sự mở theo Firestore Rules V19.
        // Cách này loại bỏ race condition giữa competition_groups và group_publication_index.
        window._graderRealtime = window._graderRealtime || {
            unsubUser:null,
            unsubAssignedGroups:new Map(),
            unsubCandidates:new Map(),
            unsubScores:new Map(),
            unsubVerifications:new Map(),
            started:false,
            assigned:[],
            groupState:new Map(),
            clock:null
        };

        window.stopGraderRealtime = function(clearCaches=true){
            const rt=window._graderRealtime;
            try{rt.unsubUser?.();}catch(e){}
            rt.unsubUser=null;
            for(const map of [rt.unsubAssignedGroups,rt.unsubCandidates,rt.unsubScores,rt.unsubVerifications]){
                map?.forEach(u=>{try{u?.();}catch(e){}});
                map?.clear?.();
            }
            if(rt.clock) clearTimeout(rt.clock);
            rt.clock=null;
            rt.started=false;
            rt.assigned=[];
            rt.groupState?.clear?.();
            if(clearCaches){
                window._allCandidatesCache=[];
                window._groupMapCache={};
                window._allowedGroupIdsCache=[];
                window._allScoresCache=[];
                window._allVerificationsCache={};
                window._selectedGradingGroupId=null;
            }
        };

        window._isGroupGateOpenLocal=function(g){
            if(!g) return false;
            const now=Date.now();
            const end=window.toMillisSafe(g.endTime) ?? window.toMillisSafe(g.publishUntil) ?? Infinity;
            if(now>end) return false;
            if(g.openMode==='auto'){
                const start=window.toMillisSafe(g.startTime) ?? window.toMillisSafe(g.publishAt);
                return start!=null && now>=start && now<=end;
            }
            // Nhóm thủ công: Mở Ngay là nguồn sự thật. Không phụ thuộc publication index.
            return g.isManuallyOpened===true;
        };

        window._seedAssignedGroupPlaceholders = function(){
            if(window.currentUserData?.role!=='Grader') return [];
            const assigned=Array.isArray(window.currentUserData?.assignedGroups)?window.currentUserData.assignedGroups:[];
            window._groupMapCache=window._groupMapCache||{};
            window._allowedGroupIdsCache=[...assigned];
            assigned.forEach(id=>{
                if(!window._groupMapCache[id]){
                    const cachedName=(window.currentUserData?.assignedGroupNames||{})[id] ||
                        (Array.isArray(window.currentUserData?.assignedGroupMeta)?window.currentUserData.assignedGroupMeta.find(x=>x?.id===id)?.name:null) ||
                        id;
                    window._groupMapCache[id]={id,name:cachedName,__instantPlaceholder:true};
                }
            });
            if(assigned.length && (!window._selectedGradingGroupId || !assigned.includes(window._selectedGradingGroupId))){
                window._selectedGradingGroupId=assigned[0];
            }
            return assigned;
        };

        window.refreshGraderGroupSelector=function(){
            if(window.currentUserData?.role!=='Grader') return;
            const sel=document.getElementById('grading-group-select'); if(!sel) return;
            const assigned=window._seedAssignedGroupPlaceholders();
            const previous=window._selectedGradingGroupId;
            if(!assigned.length){
                sel.innerHTML='<option value="">-- Chưa được phân quyền nhóm --</option>';
                sel.disabled=true;
                window._selectedGradingGroupId=null;
                const c=document.getElementById('grading-tables-container');
                if(c) c.innerHTML='<div class="bg-white p-10 rounded-2xl border border-gray-100 text-center"><i class="fas fa-lock text-3xl text-gray-400 mb-3"></i><h3 class="font-black text-gray-800">Chưa được phân quyền nhóm</h3><p class="text-xs text-gray-500 mt-2">Khi Admin cấp nhóm, danh sách nhóm sẽ xuất hiện ngay.</p></div>';
                return;
            }
            sel.disabled=false;
            sel.innerHTML=assigned.map(id=>{
                const g=window._groupMapCache?.[id];
                const name=g?.name||id;
                const suffix=(g && !g.__instantPlaceholder) ? (window._isGroupGateOpenLocal(g)?' — ĐANG MỞ':' — CHƯA MỞ') : '';
                return `<option value="${id}">${window.escapeHtml(name)}${suffix}</option>`;
            }).join('');
            window._selectedGradingGroupId=assigned.includes(previous)?previous:assigned[0];
            sel.value=window._selectedGradingGroupId;
        };

        window._rerenderGraderRealtime = function(){
            if(window.currentUserData?.role!=='Grader') return;
            const main=document.getElementById('main-content');
            if(!document.getElementById('grading-group-select')){
                if(main && typeof window.loadGradingTable==='function') window.loadGradingTable(main);
                return;
            }
            window.refreshGraderGroupSelector();
            if(window._renderGradingUIInternal) window._renderGradingUIInternal();
            const g=window._groupMapCache?.[window._selectedGradingGroupId];
            ['scoring','interview'].forEach(t=>{
                const el=document.querySelector(`.gs-content-tab[data-section="${t}"]`);
                const key=t==='scoring'?'scoringContent':'interviewContent';
                const a=g?window.getSectionAccess(g,key):{enabled:false};
                if(el) el.style.display=a.enabled?'block':'none';
            });
        };

        window.scheduleGraderGateClock=function(){
            const rt=window._graderRealtime;
            if(rt.clock) clearTimeout(rt.clock);
            rt.clock=null;
            const now=Date.now(); let nextAt=null;
            (rt.groupState||new Map()).forEach(g=>{
                if(g.openMode!=='auto') return;
                const start=window.toMillisSafe(g.startTime) ?? window.toMillisSafe(g.publishAt);
                const end=window.toMillisSafe(g.endTime) ?? window.toMillisSafe(g.publishUntil);
                for(const t of [start,end]) if(t!=null && t>now && (nextAt==null||t<nextAt)) nextAt=t;
            });
            if(nextAt!=null){
                rt.clock=setTimeout(()=>{
                    window._syncGraderRealtimeGroups();
                    window.scheduleGraderGateClock();
                },Math.max(100,Math.min(nextAt-now+150,2147480000)));
            }
        };

        window._startOpenGroupDataListeners=function(gid){
            const rt=window._graderRealtime;
            if(!rt.unsubCandidates.has(gid)){
                const q=window.query(window.collection(window.db,'candidates'),window.where('groupId','==',gid));
                const u=window.onSnapshot(q,snap=>{
                    const others=(window._allCandidatesCache||[]).filter(x=>x.groupId!==gid), mine=[];
                    snap.forEach(ds=>mine.push({id:ds.id,...ds.data()}));
                    window._allCandidatesCache=others.concat(mine);
                    window._rerenderGraderRealtime();
                },err=>{
                    console.warn('Realtime candidates error:',gid,err);
                    if(err?.code==='permission-denied') window.showToast('Nhóm vừa bị khóa hoặc quyền vừa thay đổi.','error');
                });
                rt.unsubCandidates.set(gid,u);
            }
            if(!rt.unsubScores.has(gid)){
                const q=window.query(window.collection(window.db,'scores'),window.where('groupId','==',gid),window.where('graderCode','==',window.currentUserData.code));
                const u=window.onSnapshot(q,snap=>{
                    const others=(window._allScoresCache||[]).filter(x=>x.groupId!==gid||x.graderCode!==window.currentUserData.code),mine=[];
                    snap.forEach(ds=>{const d=ds.data();if(d.graderCode===window.currentUserData.code)mine.push({id:ds.id,...d});});
                    window._allScoresCache=others.concat(mine);
                    if(!document.activeElement?.classList?.contains('score-input')) window._rerenderGraderRealtime();
                },err=>console.warn('Realtime scores error:',gid,err));
                rt.unsubScores.set(gid,u);
            }
            if(!rt.unsubVerifications.has(gid)){
                const q=window.query(window.collection(window.db,'grader_verifications'),window.where('groupId','==',gid),window.where('graderCode','==',window.currentUserData.code));
                const u=window.onSnapshot(q,snap=>{
                    const cache=Object.fromEntries(Object.entries(window._allVerificationsCache||{}).filter(([k,v])=>v.groupId!==gid||v.graderCode!==window.currentUserData.code));
                    snap.forEach(ds=>{const d=ds.data();if(d.graderCode===window.currentUserData.code)cache[`${d.graderCode}_${d.groupId}`]={id:ds.id,...d};});
                    window._allVerificationsCache=cache;
                    window._rerenderGraderRealtime();
                },err=>console.warn('Realtime verification error:',gid,err));
                rt.unsubVerifications.set(gid,u);
            }
        };

        window._stopOpenGroupDataListeners=function(gid){
            const rt=window._graderRealtime;
            for(const map of [rt.unsubCandidates,rt.unsubScores,rt.unsubVerifications]){
                try{map.get(gid)?.();}catch(e){}
                map.delete(gid);
            }
            window._allCandidatesCache=(window._allCandidatesCache||[]).filter(x=>x.groupId!==gid);
            window._allScoresCache=(window._allScoresCache||[]).filter(x=>x.groupId!==gid);
            if(window._allVerificationsCache){
                for(const k of Object.keys(window._allVerificationsCache)) if(window._allVerificationsCache[k]?.groupId===gid) delete window._allVerificationsCache[k];
            }
        };

        window._syncGraderRealtimeGroups=async function(){
            const rt=window._graderRealtime;
            const assigned=new Set(rt.assigned||[]);
            const available=new Set();
            const openNow=new Set();
            for(const [gid,g] of (rt.groupState||new Map()).entries()){
                if(!assigned.has(gid)) continue;
                available.add(gid);
                window._groupMapCache[gid]=g; // LUÔN giữ nhóm đã phân quyền trên giao diện.
                if(window._isGroupGateOpenLocal(g)) openNow.add(gid);
            }

            // Chỉ subscribe dữ liệu nhạy cảm (thí sinh/điểm) khi nhóm thực sự mở.
            for(const gid of available){
                if(openNow.has(gid)) window._startOpenGroupDataListeners(gid);
                else window._stopOpenGroupDataListeners(gid);
            }
            // Nhóm bị rút quyền/xóa khỏi state: dọn cache.
            for(const gid of Object.keys(window._groupMapCache||{})){
                if(!assigned.has(gid)){
                    window._stopOpenGroupDataListeners(gid);
                    delete window._groupMapCache[gid];
                }
            }

            const old=(window._allowedGroupIdsCache||[]).slice().sort().join('|');
            const neu=[...available].sort().join('|');
            window._allowedGroupIdsCache=[...available];
            const ids=[...available];
            if(window._selectedGradingGroupId && !available.has(window._selectedGradingGroupId)) window._selectedGradingGroupId=ids[0]||null;
            if(!window._selectedGradingGroupId && ids.length) window._selectedGradingGroupId=ids[0];
            if(old!==neu || document.getElementById('grading-group-select')) window._rerenderGraderRealtime();
            window.scheduleGraderGateClock();
        };

        window.refreshAssignedGroupSubscriptions=function(){
            const rt=window._graderRealtime;
            const assigned=new Set(rt.assigned||[]);
            for(const gid of [...rt.unsubAssignedGroups.keys()]){
                if(!assigned.has(gid)){
                    try{rt.unsubAssignedGroups.get(gid)?.();}catch(e){}
                    rt.unsubAssignedGroups.delete(gid);
                    rt.groupState.delete(gid);
                    window._stopOpenGroupDataListeners(gid);
                    delete window._groupMapCache[gid];
                }
            }
            for(const gid of assigned){
                if(rt.unsubAssignedGroups.has(gid)) continue;
                const u=window.onSnapshot(window.doc(window.db,'competition_groups',gid),snap=>{
                    if(!snap.exists()){
                        rt.groupState.delete(gid);
                    }else{
                        rt.groupState.set(gid,{id:snap.id,...snap.data()});
                    }
                    window._syncGraderRealtimeGroups();
                },err=>{
                    console.warn('Realtime assigned group error:',gid,err);
                    if(err?.code==='permission-denied') window.showToast('Không thể đọc trạng thái nhóm được phân quyền. Hãy cập nhật Firestore Rules V19.','error');
                });
                rt.unsubAssignedGroups.set(gid,u);
            }
            window._syncGraderRealtimeGroups();
        };

        window.startGraderRealtime=function(){
            if(window.currentUserData?.role!=='Grader') return;
            window.stopGraderRealtime(false);
            const rt=window._graderRealtime;
            rt.started=true;
            rt.assigned=Array.isArray(window.currentUserData.assignedGroups)?window.currentUserData.assignedGroups:[];
            const uid=window.currentUserData.id;

            if(uid){
                rt.unsubUser=window.onSnapshot(window.doc(window.db,'users',uid),async snap=>{
                    if(!snap.exists()){
                        window.showToast('Tài khoản giám khảo đã bị thu hồi.','error');
                        return window.handleLogout();
                    }
                    const d=snap.data()||{};
                    const old=(rt.assigned||[]).slice().sort().join('|');
                    const next=Array.isArray(d.assignedGroups)?d.assignedGroups:[];
                    window.currentUserData={...window.currentUserData,...d,id:uid,code:window.currentUserData.code};
                    rt.assigned=next;
                    localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));
                    if(d.status==='Inactive'){
                        window.showToast('Thẻ giám khảo đã bị khóa bởi Admin.','error');
                        return window.handleLogout();
                    }
                    await window.syncGraderSession(true,'permissions-updated');
                    window.refreshAssignedGroupSubscriptions();
                    if(old!==next.slice().sort().join('|')) window.showToast('Quyền nhóm của bạn vừa được cập nhật realtime.');
                },err=>console.warn('Realtime user error:',err));
            }

            window.syncGraderSession(true,'realtime-start').then(ok=>{
                if(ok) window.refreshAssignedGroupSubscriptions();
                else window.showToast('Không thể xác nhận phiên giám khảo với Firebase.','error');
            });
        };

        window.renderGradingShell=function(container,isAdmin,groupOptions=''){
            container.innerHTML = `<div class="bg-white p-4 rounded-t-2xl shadow-sm border border-gray-100 border-b-0 flex flex-col md:flex-row items-center gap-3 z-[40] animate-fade-up"><div class="flex items-center gap-2 w-full md:w-auto shrink-0"><div class="bg-red-50 w-8 h-8 rounded-full flex items-center justify-center text-red-800"><i class="fas fa-layer-group text-[10px]"></i></div><select id="grading-group-select" onchange="window.changeGradingGroup()" class="w-full md:w-56 border-none py-1.5 rounded-lg text-xs font-bold text-red-800 outline-none cursor-pointer hover:bg-red-50 transition">${groupOptions||'<option value="">-- Chọn nhóm --</option>'}</select></div>${isAdmin?`<div class="hidden md:block w-px h-5 bg-gray-200"></div><div class="flex items-center gap-2 w-full md:w-auto shrink-0"><div class="bg-blue-50 w-8 h-8 rounded-full flex items-center justify-center text-blue-600"><i class="fas fa-eye text-[10px]"></i></div><select id="grading-grader-select" onchange="window.renderGradingTables()" class="w-full md:w-48 border-none py-1.5 rounded-lg text-xs font-bold text-blue-700 outline-none cursor-pointer hover:bg-blue-50 transition"></select></div>`:''}<div class="flex-1 relative w-full ml-auto md:max-w-xs"><i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-[11px]"></i><input type="text" id="filter-search" oninput="window.renderGradingTables()" placeholder="Tìm thí sinh nhanh..." class="w-full border border-gray-200 pl-8 pr-3 py-2 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-red-100 focus:border-red-500 transition bg-gray-50"></div></div><div class="gs-content-tabs animate-fade-up" id="grader-content-tabs"><button class="gs-content-tab active" data-section="scores" onclick="window.showGraderSection('scores')"><i class="fas fa-table mr-1"></i> 1. Tiêu chí chấm điểm</button><button class="gs-content-tab" data-section="scoring" onclick="window.showGraderSection('scoring')"><i class="fas fa-book-open mr-1"></i> Nội dung tiêu chí chấm</button><button class="gs-content-tab" data-section="interview" onclick="window.showGraderSection('interview')"><i class="fas fa-file-alt mr-1"></i> Câu hỏi phỏng vấn</button></div><div id="grader-section-panel" style="display:none" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar"></div><div id="grading-score-panel" class="flex-1 flex flex-col min-h-0 animate-fade-up"><div id="grading-tables-container" class="flex-1 flex flex-col min-h-0"></div></div>`;
            window._renderGradingUIInternal=window.renderGradingTables;
        };
        window.loadGradingTable = async function(container) {
            try{
                if(!window.currentUserData?.code) return window.renderErrorState(container,'Phiên đăng nhập không hợp lệ.');
                const isAdmin=['Admin','SuperAdmin'].includes(window.currentUserData.role);
