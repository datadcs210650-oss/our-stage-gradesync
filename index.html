                if (!timeStatus.active) { actionButtons = `${graderNameDisplay} <div class="text-[11px] font-bold text-${timeStatus.color}-700 bg-${timeStatus.color}-50 px-3 py-2 rounded-lg border border-${timeStatus.color}-200 flex items-center whitespace-normal w-full max-w-[200px]"><i class="fas ${timeStatus.icon} mr-1"></i> ${timeStatus.text}</div>`; }
                else if (!isVerified) { actionButtons = `${graderNameDisplay} <button onclick="window.verifyGroupGrading('${gId}')" class="bg-red-800 hover:bg-red-900 text-white font-bold px-4 py-2 rounded-lg text-xs transition-all shadow-md flex items-center gap-2 btn-press whitespace-nowrap"><i class="fas fa-lock"></i> Khóa Nộp</button>`; } 
                else { actionButtons = `${graderNameDisplay} <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap"><i class="fas fa-check-double"></i> Đã nộp</div>`; }
            }

            let timeBadge = `<span class="bg-${timeStatus.color}-100 text-${timeStatus.color}-700 px-2 py-0.5 rounded text-[10px] font-bold shadow-sm border border-${timeStatus.color}-200 ml-2 whitespace-nowrap"><i class="fas ${timeStatus.icon} mr-1"></i> ${timeStatus.text}</span>`;
            let attBadge = groupInfo.attendanceEnabled ? `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold shadow-sm border border-blue-200 ml-2 whitespace-nowrap"><i class="fas fa-user-check"></i> Có Đ.Danh</span>` : '';

            container.innerHTML = `<div class="bg-white p-1 rounded-b-2xl shadow-sm border border-gray-100 border-t-0 flex flex-col h-full relative"><div class="flex flex-col lg:flex-row justify-between items-start lg:items-center p-4 border-b border-gray-100 gap-4 shrink-0 bg-gray-50/50 mx-1 mt-1 rounded-t-xl"><div class="flex flex-wrap items-center gap-2 w-full lg:w-auto"><h3 class="text-base font-black text-red-800 uppercase flex items-center flex-wrap gap-1 w-full md:w-auto"><i class="fas fa-folder-open mr-1"></i>${window.escapeHtml(groupInfo.name)} ${timeBadge} ${attBadge}</h3><span class="bg-white text-gray-600 px-2 py-1 rounded text-[11px] font-bold border border-gray-200 ml-2">Điểm Pass: ≥ ${groupInfo.passScore} đ</span></div><div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-start lg:justify-end">${actionButtons}</div></div><div class="w-full custom-scrollbar sticky-table-container rounded-b-2xl flex-1 pb-1"><table class="w-full text-left text-sm border-collapse min-w-max"><thead><tr>${tableHeaders}</tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
            requestAnimationFrame(restoreScroll);
            setTimeout(restoreScroll, 0);
        };

        window._scoreSaveTimers = window._scoreSaveTimers || {};
        window._scoreSaveInFlight = window._scoreSaveInFlight || {};
        window._scoreSavePending = window._scoreSavePending || {};
        window.autoSaveScore = function(cId,gId,pS){
            window._scoreSavePending[cId]={gId,pS};
            clearTimeout(window._scoreSaveTimers[cId]);
            window._scoreSaveTimers[cId]=setTimeout(()=>window.saveScoreNow(cId,gId,pS),420);
        };
        window.saveScoreNow = async function(cId,gId,pS){
            if(navigator.onLine===false){
                window._offlinePendingScores[cId]={gId,pS};
                const el=document.getElementById(`save-status-${cId}`);
                if(el){el.innerText='Chờ mạng...';el.style.opacity='1';el.className='absolute -bottom-1 left-1/2 transform -translate-x-1/2 text-[8px] text-amber-600 font-bold';}
                return false;
            }
            if(window._scoreSaveInFlight[cId]){window._scoreSavePending[cId]={gId,pS};return false;}
            window._scoreSaveInFlight[cId]=true;
            delete window._scoreSavePending[cId];

            const setSaveState=(msg,color='emerald')=>{
                const el=document.getElementById(`save-status-${cId}`);
                if(!el) return;
                el.innerText=msg; el.style.opacity='1';
                el.className=`absolute -bottom-1 left-1/2 transform -translate-x-1/2 text-[8px] text-${color}-600 font-bold transition-opacity`;
            };

            try{
                if(window.currentUserData?.role==='Grader'){
                    const au=window.auth?.currentUser;
                    if(!au?.isAnonymous) throw Object.assign(new Error('GRADER_AUTH_MISSING'),{code:'grader-auth-missing'});
                    const sessionOK=await window.syncGraderSession(true,'score-save');
                    if(!sessionOK) throw Object.assign(new Error('GRADER_SESSION_SYNC_FAILED'),{code:'grader-session-sync-failed'});
                }

                const inputs=[...document.querySelectorAll(`input.score-input[data-cand="${cId}"][data-group="${gId}"]`)];
                const scores={}; let total=0,changes=[];
                const graderCode=window.currentUserData?.code||'UNK';
                const candidate=(window._allCandidatesCache||[]).find(c=>c.id===cId);
                const groupInfo=window._groupMapCache?.[gId]||{};

                inputs.forEach(i=>{
                    const crit=i.getAttribute('data-crit'),weight=parseFloat(i.getAttribute('data-weight'))||0;
                    const raw=String(i.value??'').trim();
                    if(raw==='') return; // ô bị xóa => tiêu chí đó bị xóa khỏi Firestore
                    let v=parseFloat(raw);
                    if(Number.isNaN(v)) return;
                    if(v>100){v=100;i.value='100';}
                    if(v<0){v=0;i.value='0';}
                    scores[crit]=v; total+=(v*weight)/100;
                });
                total=Number(total.toFixed(2));

                const scoreId=`${graderCode}_${cId}`.replace(/[^a-zA-Z0-9_-]/g,'_');
                const scoreRef=window.doc(window.db,'scores',scoreId);
                let cached=window._gradedDataCache?.[cId]||{};
                let cachedRevision=(cached.id===scoreId)?Number(cached.revision||0):0;

                // Nếu chưa từng có bảng điểm và mọi ô đều trống thì chỉ đưa UI về CHỜ, không tạo document rỗng.
                if(!Object.keys(scores).length && cachedRevision<=0){
                    try{
                        const serverSnap=await window.getDoc(scoreRef);
                        if(serverSnap.exists()){
                            cached={id:serverSnap.id,...serverSnap.data()};
                            cachedRevision=Number(cached.revision||0);
                        }
                    }catch(_e){}
                    if(cachedRevision<=0){
                        window._gradedDataCache=window._gradedDataCache||{};
                        window._gradedDataCache[cId]={};
                        const totalEl=document.getElementById(`tot-${cId}`),statusEl=document.getElementById(`status-container-${cId}`);
                        if(totalEl){totalEl.innerText='0';totalEl.className='font-bold text-base text-gray-400';}
                        if(statusEl)statusEl.innerHTML='<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[9px] font-medium border border-gray-200">CHỜ</span>';
                        return true;
                    }
                }

                const hasAnyScore=Object.keys(scores).length>0;
                const passed=hasAnyScore && total>=Number(pS);
                const totalEl=document.getElementById(`tot-${cId}`),statusEl=document.getElementById(`status-container-${cId}`);
                if(totalEl){totalEl.innerText=hasAnyScore?total:'0';totalEl.className=`font-bold text-base ${hasAnyScore?(passed?'text-emerald-600':'text-rose-600'):'text-gray-400'}`;}
                if(statusEl)statusEl.innerHTML=hasAnyScore
                    ? `<span class="${passed?'bg-emerald-50 text-emerald-600 border-emerald-200':'bg-rose-50 text-rose-600 border-rose-200'} px-2 py-1 rounded text-[10px] font-bold border">${passed?'PASS':'FAIL'}</span>`
                    : '<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[9px] font-medium border border-gray-200">CHỜ</span>';
                setSaveState('Đang lưu...','amber');

                const graderName=`${window.currentUserData?.name||'Giám khảo'} - ${graderCode}`;
                let committedRevision=0;
                const basePayload={candidateId:cId,groupId:gId,graderCode,graderName,scores,totalScore:total,schemaVersion:2,locked:false,timestamp:window.serverTimestamp(),updatedAt:window.serverTimestamp()};

                if(cachedRevision<=0){
                    try{
                        await window.setDoc(scoreRef,{...basePayload,revision:1});
                        committedRevision=1;
                    }catch(createErr){
                        const serverSnap=await window.getDoc(scoreRef);
                        if(!serverSnap.exists()) throw createErr;
                        cached={id:serverSnap.id,...serverSnap.data()};
                        cachedRevision=Number(cached.revision||0);
                        window._gradedDataCache=window._gradedDataCache||{};
                        window._gradedDataCache[cId]=cached;
                    }
                }

                if(committedRevision===0){
                    const expectedRevision=Number((window._gradedDataCache?.[cId]?.id===scoreId ? window._gradedDataCache[cId].revision : cachedRevision)||0);
                    committedRevision=await window.runTransaction(window.db,async tx=>{
                        const latest=await tx.get(scoreRef);
                        if(!latest.exists()){const err=new Error('SCORE_MISSING_RETRY');err.code='score-missing-retry';throw err;}
                        const old=latest.data()||{};
                        const serverRevision=Number(old.revision||0);
                        if(serverRevision!==expectedRevision){const err=new Error('SCORE_CONFLICT');err.serverRevision=serverRevision;throw err;}
                        const oldScores=old.scores||{};
                        const keys=new Set([...Object.keys(oldScores),...Object.keys(scores)]);
                        keys.forEach(k=>{
                            const before=oldScores[k]; const after=scores[k];
                            const same=(before===undefined&&after===undefined)||(Number(before)===Number(after) && before!==undefined && after!==undefined);
                            if(!same) changes.push(`[${k}]: ${before??'-'} → ${after??'-'}`);
                        });
                        const nextRevision=serverRevision+1;
                        // Không merge scores: phải thay toàn bộ map để ô đã xóa không còn dữ liệu cũ trên Firestore.
                        tx.set(scoreRef,{...basePayload,revision:nextRevision});
                        return nextRevision;
                    });
                }

                window._gradedDataCache=window._gradedDataCache||{};
                window._gradedDataCache[cId]={id:scoreId,candidateId:cId,groupId:gId,graderCode,graderName,scores,totalScore:total,revision:committedRevision,locked:false};

                if(changes.length || committedRevision===1){
                    try{
                        await window.setDoc(window.doc(window.db,'audit_logs',`${scoreId}_${committedRevision}_${Date.now()}`),{
                            candidateId:cId,candidateName:candidate?.name||'TS',graderCode,graderName,groupId:gId,groupName:groupInfo.name||'',scoreValue:total,
                            scoreChanged:true,changeContent:changes.length?changes.join(' | '):(hasAnyScore?'Tạo bảng điểm lần đầu':'Xóa toàn bộ điểm hiện tại'),revision:committedRevision,
                            timestamp:window.serverTimestamp(),schemaVersion:2
                        });
                    }catch(e){console.warn('AUDIT LOG SAVE ERROR:',e);}
                }

                setSaveState('Đã lưu ✓','emerald');
                setTimeout(()=>{const el=document.getElementById(`save-status-${cId}`);if(el)el.style.opacity='0';},1100);
                return true;
            }catch(e){
                console.error('SAVE SCORE ERROR:',e);
                setSaveState(e.message==='SCORE_CONFLICT'?'Đang đồng bộ':'Lỗi lưu','rose');
                if(e.message==='SCORE_CONFLICT'){
                    try{
                        const scoreId=`${(window.currentUserData?.code||'UNK')}_${cId}`.replace(/[^a-zA-Z0-9_-]/g,'_');
                        const snap=await window.getDoc(window.doc(window.db,'scores',scoreId));
                        if(snap.exists())window._gradedDataCache[cId]={id:snap.id,...snap.data()};
                        window._scoreSavePending[cId]={gId,pS};
                    }catch(_e){}
                }else if(e.code==='permission-denied' || e.code==='grader-session-sync-failed' || e.code==='grader-auth-missing'){
                    try{
                        if(window.currentUserData?.id){
                            const u=await window.getDoc(window.doc(window.db,'users',window.currentUserData.id));
                            if(u.exists()){
                                const d=u.data()||{};
                                window.currentUserData={...window.currentUserData,...d,id:u.id,code:window.currentUserData.code||d.code};
                                if(window._graderRealtime) window._graderRealtime.assigned=Array.isArray(d.assignedGroups)?d.assignedGroups:[];
                                localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));
                            }
                        }
                        const ok=await window.syncGraderSession(true,'score-permission-recover');
                        if(ok){window.refreshAssignedGroupSubscriptions?.();window._scoreSavePending[cId]={gId,pS};window.showToast('Đã đồng bộ lại quyền. Hệ thống đang thử lưu điểm lại.');}
                        else window.showToast('Không thể xác nhận phiên giám khảo. Hãy đăng xuất và đăng nhập lại mã BGK.','error');
                    }catch(_e){window.showToast('Không thể khôi phục quyền lưu điểm. Hãy đăng nhập lại.','error');}
                }else window.showToast('Không lưu được điểm: '+(e.message||e.code||'Lỗi không xác định'),'error');
                return false;
            }finally{
                window._scoreSaveInFlight[cId]=false;
                const pending=window._scoreSavePending[cId];
                if(pending){delete window._scoreSavePending[cId];setTimeout(()=>window.saveScoreNow(cId,pending.gId,pending.pS),80);}
            }
        };

        window.verifyGroupGrading = function(gId) {
            const graderCode=window.currentUserData?.code; if(!graderCode||!gId) return window.showToast('Thiếu thông tin giám khảo/nhóm!','error');
            const groupInfo=window._groupMapCache?.[gId]; if(!groupInfo) return window.showToast('Không tìm thấy nhóm thi!','error');
            window.showCustomConfirm('NỘP ĐIỂM? Sau khi xác nhận, bảng điểm của giám khảo sẽ bị KHÓA.',async()=>{
                window.showLoading(true,'Đang hoàn tất lưu điểm...');
                try{
                    Object.values(window._scoreSaveTimers||{}).forEach(t=>clearTimeout(t));
                    const pending=[...document.querySelectorAll(`input.score-input[data-group="${gId}"]`)].map(i=>i.dataset.cand).filter(Boolean);
                    for(const cid of [...new Set(pending)]) await window.saveScoreNow(cid,gId,groupInfo.passScore);
                    const myScores=(window._allScoresCache||[]).filter(s=>s.groupId===gId && s.graderCode===graderCode);
                    const localScores=Object.values(window._gradedDataCache||{}).filter(s=>s.groupId===gId && s.graderCode===graderCode);
                    if(myScores.length===0 && localScores.length===0) throw new Error('Chưa có điểm nào được lưu, không thể nộp bảng điểm.');

                    window.showLoading(true,'Đang khóa bảng điểm...');
                    await window.syncGraderSession(true,'submit-grading');
                    const verifyId=`${graderCode}_${gId}`.replace(/[^a-zA-Z0-9_-]/g,'_');
                    const verifyRef=window.doc(window.db,'grader_verifications',verifyId);

                    // Không transaction.get document chưa tồn tại. Rules V22 khóa update nếu đã verified.
                    await window.setDoc(verifyRef,{
                        groupId:gId,graderCode,graderName:`${window.currentUserData.name||'Giám khảo'} - ${graderCode}`,
                        isVerified:true,timestamp:window.serverTimestamp(),schemaVersion:2
                    },{merge:true});

                    window.showToast('Đã khóa và nộp bảng điểm thành công!');
                    window.renderGradingTables();
                }catch(e){
                    console.error('VERIFY GRADING ERROR:',e);
                    window.showToast('Không khóa được bảng điểm: '+(e.message||e.code),'error');
                }finally{window.showLoading(false);}
            });
        };

        // Tên cũ để tương thích nếu có chỗ gọi vGG.
        window.vGG = window.verifyGroupGrading;

        // --- CẮT XUỐNG PHẦN 4 ---
// --- BẮT ĐẦU PHẦN 4 ---
        window.loadAdminLiveMonitor = async function(container) {
            try {
                const groupSnap = await window.getDocs(window.collection(window.db, "competition_groups")); let groupMap = {}; groupSnap.forEach(d => { groupMap[d.id] = d.data(); });
                const userSnap = await window.getDocs(window.collection(window.db, "users")); let graders = []; userSnap.forEach(d => { const u = d.data(); if(u.role === 'Grader') graders.push({ id: d.id, ...u }); });
                const verifySnap = await window.getDocs(window.collection(window.db, "grader_verifications")); let verifications = {}; verifySnap.forEach(doc => { const d = doc.data(); if(d.isVerified) { let st = d.timestamp ? (d.timestamp.toDate ? d.timestamp.toDate() : new Date(d.timestamp.seconds * 1000)) : new Date(); let timeStr = `${String(st.getHours()).padStart(2,'0')}:${String(st.getMinutes()).padStart(2,'0')} - ${String(st.getDate()).padStart(2,'0')}/${String(st.getMonth()+1).padStart(2,'0')}/${st.getFullYear()}`; verifications[`${d.graderCode}_${d.groupId}`] = { id: doc.id, timeStr, ...d }; } });

                let html = `<div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col h-[75vh] animate-fade-up"><h3 class="text-base font-black text-gray-800 mb-4 flex items-center"><i class="fas fa-shield-alt text-blue-600 mr-2"></i>Trạng thái Ký Xác Nhận Của Giám Khảo</h3><div class="space-y-3 flex-1 overflow-y-auto custom-scrollbar pr-2 pb-2">`;
                graders.forEach(gr => {
                    const assigned = gr.assignedGroups || [];
                    if (assigned.length === 0) { html += `<div class="bg-gray-50 p-4 rounded-xl border border-gray-100 text-xs text-gray-400 italic">Giám khảo <b class="text-gray-600">${window.escapeHtml(gr.name)}</b> chưa được phân công.</div>`; }
                    assigned.forEach(gId => {
                        const group = groupMap[gId]; if(!group) return; const vKey = `${gr.code}_${gId}`; const verifyInfo = verifications[vKey]; const isLocked = verifyInfo ? verifyInfo.isVerified : false;
                        const signTimeDisplay = isLocked ? `<span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100 mt-2 inline-block"><i class="fas fa-signature mr-1"></i>Đã ký: ${verifyInfo.timeStr}</span>` : `<span class="text-[10px] font-medium text-gray-400 bg-gray-100 px-2 py-1 rounded inline-block mt-2">Chưa nộp điểm</span>`;
                        html += `<div class="bg-white p-4 rounded-xl border ${isLocked ? 'border-emerald-200' : 'border-gray-200'} flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all hover-lift"><div><div class="flex items-center gap-2 mb-1"><p class="font-bold text-gray-800 text-sm flex flex-wrap items-center gap-2">${window.escapeHtml(gr.name)} <span class="text-[10px] font-mono text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded">${window.escapeHtml(gr.code)}</span>${window.presenceBadgeHtml(gr.code)}</p></div><p class="text-[11px] font-semibold text-gray-500"><i class="fas fa-folder-open text-gray-400 mr-1"></i> Nhóm: <span class="text-red-800">${window.escapeHtml(group.name || '')}</span></p>${signTimeDisplay}</div><div>${isLocked ? `<button onclick="window.adminUnlockGrader('${gId}', '${gr.code}')" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded-lg font-bold shadow-sm transition text-xs btn-press"><i class="fas fa-unlock-alt"></i> Mở khóa</button>` : '<div class="px-3 py-1.5 bg-gray-50 text-gray-400 rounded-lg font-medium text-[11px] border border-gray-100"><i class="fas fa-lock-open"></i> Đang mở</div>'}</div></div>`;
                    });
                });
                html += `</div></div>`; container.innerHTML = html;
            } catch(e) { window.renderErrorState(container, e.message); }
        };
        
        window.adminUnlockGrader = function(groupId, graderCode) { window.showCustomConfirm(`Xác nhận MỞ KHÓA KHẨN CẤP cho giám khảo ${graderCode}?`, async () => { window.showLoading(true, "Đang mở khóa..."); try { const snap = await window.getDocs(window.collection(window.db, "grader_verifications")); const targetDocs = snap.docs.filter(d => d.data().groupId === groupId && d.data().graderCode === graderCode); for(let d of targetDocs) { await window.deleteDoc(window.doc(window.db, "grader_verifications", d.id)); } window.showToast("Mở khóa thành công!"); await window.loadAdminLiveMonitor(document.getElementById('main-content')); } catch(e){ window.showToast("Lỗi: " + e.message, "error"); } window.showLoading(false); }); };

        window.loadAuditLogs = async function(container) {
            try {
                const logSnap = await window.getDocs(window.collection(window.db, "audit_logs")); let logs = [];
                logSnap.forEach(doc => { const d = doc.data(); if(d.candidateName && d.graderName && d.scoreChanged) { logs.push(d); } });
                logs.sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                
                const groupSnap = await window.getDocs(window.collection(window.db, "competition_groups")); let groups = []; let groupMapLocal = {};
                groupSnap.forEach(d => { const dData = d.data(); groups.push(dData.name); groupMapLocal[dData.name] = dData; });
                
                let graders = [...new Set(logs.map(l => l.graderName))]; window._rawLogsCache = logs; window._groupMapLocalCache = groupMapLocal;

                let groupFilterOptions = '<option value="">-- Tất cả Nhóm --</option>' + groups.map(g => `<option value="${window.escapeHtml(g)}">${window.escapeHtml(g)}</option>`).join('');
                let graderOptions = '<option value="">-- Tất cả Giám khảo --</option>' + graders.map(g => `<option value="${window.escapeHtml(g)}">${window.escapeHtml(g)}</option>`).join('');

                    accountsHtml += `<div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 hover-lift relative overflow-hidden transition-all group"><div class="absolute top-4 right-4">${statusBtn}</div><div class="flex items-center gap-4 mb-4"><div class="w-12 h-12 bg-red-50 text-red-700 rounded-2xl flex items-center justify-center text-xl font-black shadow-inner border border-red-100 shrink-0"><i class="fas fa-user-edit"></i></div><div class="pr-20"><h4 class="font-black text-gray-900 text-base leading-tight">${window.escapeHtml(u.name)}</h4><div class="flex items-center gap-2 mt-1"><p class="font-mono text-gray-500 text-[10px] font-bold bg-gray-50 px-1.5 py-0.5 rounded border border-gray-100">${window.escapeHtml(u.code)}</p><button onclick="window.copyCode('${window.escapeHtml(u.code)}')" class="text-gray-400 hover:text-blue-600 transition btn-press"><i class="fas fa-copy text-xs"></i></button></div></div></div><div class="mb-5"><p class="text-[9px] text-gray-400 font-bold uppercase tracking-widest mb-2 border-b border-gray-50 pb-1">Nhóm được phân công</p><div class="flex flex-wrap gap-1.5 h-12 overflow-y-auto custom-scrollbar content-start">${groupTags || '<span class="text-xs text-gray-400 italic">Chưa giao nhóm nào</span>'}</div></div><div class="flex gap-2 pt-4 border-t border-gray-50"><button onclick="window.openEditGraderModal('${u.id}', '${window.escapeHtml(u.name)}', '${window.escapeHtml(u.code)}', '${assigned.join(',')}')" class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2.5 rounded-xl text-xs transition shadow-sm btn-press"><i class="fas fa-edit mr-1"></i> Sửa</button>${isActive ? `<button onclick="window.toggleAccountStatus('${u.id}', 'Inactive')" class="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-600 font-bold py-2.5 rounded-xl text-xs transition shadow-sm btn-press border border-gray-200"><i class="fas fa-ban mr-1"></i> Khóa</button>` : `<button onclick="window.toggleAccountStatus('${u.id}', 'Active')" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-2.5 rounded-xl text-xs transition shadow-sm btn-press border border-emerald-100"><i class="fas fa-unlock mr-1"></i> Mở</button>`}<button onclick="window.deleteAccount('${u.id}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold px-4 py-2.5 rounded-xl text-xs transition shadow-sm btn-press border border-rose-100"><i class="fas fa-trash-alt"></i></button></div></div>`;
                });

                container.innerHTML = `
                    <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-6 animate-fade-up">
                        <h3 class="text-lg font-black mb-5 text-gray-900 tracking-tight"><i class="fas fa-user-shield text-red-800 mr-2"></i>Cấp Thẻ ID Giám khảo Mới</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div class="relative"><i class="fas fa-user absolute left-4 top-3.5 text-gray-400"></i><input type="text" id="acc-name" placeholder="Họ và tên Giám khảo" class="w-full border border-gray-200 pl-10 pr-4 py-3 rounded-xl text-sm font-semibold outline-none input-focus-effect bg-gray-50"></div>
                            <div class="flex gap-2">
                                <div class="relative flex-1"><i class="fas fa-id-card absolute left-4 top-3.5 text-red-400"></i><input type="text" id="acc-code" placeholder="Mã số tự động" class="w-full border border-red-200 pl-10 pr-4 py-3 rounded-xl text-sm outline-none bg-red-50 font-mono font-bold text-red-800" readonly></div>
                                <button onclick="window.generateRandomCode()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-4 rounded-xl text-sm transition btn-press"><i class="fas fa-sync-alt"></i></button>
                            </div>
                        </div>
                        <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 border-b border-gray-100 pb-2">Chỉ định nhóm phụ trách:</label>
                        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 mb-5">
                            ${groups.map(g => `<label class="relative flex items-center justify-center p-3 cursor-pointer group"><input type="checkbox" value="${g.id}" class="acc-group-chk hidden modal-checkbox"><div class="w-full text-center bg-gray-50 border border-gray-200 rounded-xl py-2 px-1 transition-all group-hover:border-red-300 group-hover:bg-red-50/50"><i class="fas fa-check text-gray-300 opacity-0 transition-opacity mb-1 block"></i><span class="font-bold text-[10px] text-gray-700 uppercase block tracking-wider truncate" title="${window.escapeHtml(g.name)}">${window.escapeHtml(g.name)}</span></div></label>`).join('')}
                        </div>
                        <div class="flex justify-end"><button onclick="window.createAccountByCode()" class="bg-gradient-to-r from-red-800 to-red-600 hover:from-red-900 hover:to-red-700 text-white font-black px-8 py-3 rounded-xl transition-all shadow-lg shadow-red-900/20 text-xs flex items-center gap-2 btn-press"><i class="fas fa-id-badge"></i> Tạo Giám Khảo</button></div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-fade-up" style="animation-delay: 0.1s;">
                        ${accountsHtml || '<div class="col-span-full text-center py-10 text-gray-400 italic bg-white rounded-3xl border border-gray-100">Hệ thống chưa có thẻ Giám khảo nào.</div>'}
                    </div>
                `;
                window._groupsListCacheForModal = groups; window.generateRandomCode();
            } catch(e) { window.renderErrorState(container, e.message); }
        };

        window.openEditGraderModal = function(userId, name, code, assignedStr) {
            const assigned = assignedStr.split(','); const groups = window._groupsListCacheForModal || [];
            document.getElementById('custom-modal-box').innerHTML = `
                <div class="mb-6 flex justify-between items-center"><h3 class="text-xl font-black text-gray-900"><i class="fas fa-edit text-red-600 mr-2"></i>Sửa Thẻ Giám Khảo</h3><button onclick="window.closeCustomModal()" class="text-gray-400 hover:text-gray-700 bg-gray-100 hover:bg-gray-200 w-8 h-8 rounded-full transition flex items-center justify-center btn-press"><i class="fas fa-times"></i></button></div>
                <div class="space-y-4 mb-6">
                    <div><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-1">Tên hiển thị</label><input type="text" id="edit-grader-name-modal" value="${name}" class="w-full border border-gray-200 px-4 py-3 rounded-xl text-sm font-bold outline-none input-focus-effect bg-gray-50"></div>
                    <div><label class="text-[10px] font-bold text-gray-500 uppercase tracking-widest block mb-1">Mã định danh (Code)</label><input type="text" value="${code}" disabled class="w-full border border-gray-200 px-4 py-3 rounded-xl text-sm font-mono font-bold bg-gray-100 text-gray-500 cursor-not-allowed"></div>
                </div>
                <label class="block text-[10px] font-black text-gray-500 uppercase tracking-widest mb-3 border-b border-gray-100 pb-2">Tái phân công Nhóm chấm thi:</label>
                <div class="grid grid-cols-2 gap-3 mb-6 max-h-48 overflow-y-auto custom-scrollbar">
                    ${groups.map(g => `<label class="relative flex items-center justify-center p-2 cursor-pointer group"><input type="checkbox" value="${g.id}" class="grader-edit-chk-modal hidden modal-checkbox" ${assigned.includes(g.id) ? 'checked' : ''}><div class="w-full text-center bg-gray-50 border border-gray-200 rounded-xl py-2 px-1 transition-all group-hover:border-red-300 group-hover:bg-red-50/50"><i class="fas fa-check text-gray-300 opacity-0 transition-opacity mb-1 block"></i><span class="font-bold text-[10px] text-gray-700 uppercase block tracking-wider truncate" title="${window.escapeHtml(g.name)}">${window.escapeHtml(g.name)}</span></div></label>`).join('')}
                </div>
                <div class="flex justify-end gap-3"><button onclick="window.closeCustomModal()" class="bg-white border border-gray-200 text-gray-700 font-bold px-6 py-3 rounded-xl text-xs btn-press">Hủy bỏ</button><button onclick="window.saveGraderEdit('${userId}')" class="bg-red-600 hover:bg-red-700 text-white font-black px-6 py-3 rounded-xl text-xs shadow-md shadow-red-200 btn-press"><i class="fas fa-save mr-1"></i> Lưu Thay Đổi</button></div>
            `;
            window.openModal();
        };

        window.saveGraderEdit = async function(userId) {
            const newName = document.getElementById('edit-grader-name-modal').value.trim(); if(!newName) { window.showToast("Tên không được để trống!", "error"); return; }
            let assignedGroups = []; document.querySelectorAll('.grader-edit-chk-modal:checked').forEach(chk => { assignedGroups.push(chk.value); });
            window.closeCustomModal(); window.showLoading(true, "Cập nhật hồ sơ..."); try { await window.setDoc(window.doc(window.db, "users", userId), { name: window.cleanTextForStore(newName), assignedGroups: assignedGroups }, { merge: true }); window.showToast("Cập nhật thành công!"); await window.loadAccountManager(document.getElementById('main-content')); } catch(e){ window.showToast('Không thể cập nhật giám khảo: '+(e.message||e.code),'error'); } window.showLoading(false);
        };

        window.generateRandomCode = function() { const cInput = document.getElementById('acc-code'); if(cInput) cInput.value = 'GS-' + Math.random().toString(36).substring(2, 6).toUpperCase(); };
        window.copyCode = function(code) { navigator.clipboard.writeText(code).then(() => { window.showToast(`Đã copy ID: ${code}`); }); };
        
        window.createAccountByCode = async function() {
            const name = document.getElementById('acc-name').value.trim(); const code = document.getElementById('acc-code').value.trim();
            if(!name || !code) { window.showToast("Vui lòng nhập tên", "error"); return; } let assignedGroups = []; document.querySelectorAll('.acc-group-chk:checked').forEach(chk => { assignedGroups.push(chk.value); });
            window.showLoading(true, "Đang đăng ký..."); try { await window.addDoc(window.collection(window.db, "users"), { code: window.cleanTextForStore(code), name: window.cleanTextForStore(name), role: "Grader", status: "Active", assignedGroups, updatedAt: window.serverTimestamp() }); window.showToast("Cấp thẻ ID thành công!"); await window.loadAccountManager(document.getElementById('main-content')); } catch(e){} window.showLoading(false);
        };
        window.toggleAccountStatus = async function(userId, newStatus) { window.showLoading(true, "Đang xử lý..."); try { await window.setDoc(window.doc(window.db, "users", userId), { status: newStatus }, { merge: true }); await window.loadAccountManager(document.getElementById('main-content')); window.showToast("Đã đổi trạng thái!"); } catch(e){} window.showLoading(false); };
        window.deleteAccount = function(id) { window.showCustomConfirm("Xóa vĩnh viễn thẻ này?", async () => { window.showLoading(true, "Đang xóa..."); try { await window.deleteDoc(window.doc(window.db, "users", id)); await window.loadAccountManager(document.getElementById('main-content')); window.showToast("Đã xóa!"); } catch(e){} window.showLoading(false); }); };

    </script>

<script type="module" id="v20-grader-2view-script">
(function(){
    window._gradingViewMode = window._gradingViewMode || (localStorage.getItem('gradeSyncGradingViewMode') || 'table');
    window._selectedGradingCandidateId = window._selectedGradingCandidateId || null;

    window.setGradingViewMode = function(mode){
        window._gradingViewMode = mode === 'personal' ? 'personal' : 'table';
        try{ localStorage.setItem('gradeSyncGradingViewMode', window._gradingViewMode); }catch(_e){}
        window.renderGradingTables();
    };

    window.selectGradingCandidate = function(candidateId){
        window._selectedGradingCandidateId = candidateId || null;
        window.renderGradingTables();
    };

    window.getLatestScoreRecordForCandidate = function(candidateId, graderCode){
        const candScores = (window._allScoresCache || []).filter(s => s.candidateId === candidateId && s.graderCode === graderCode);
        return candScores.length > 0
            ? candScores.reduce((prev, current) => ((prev.timestamp?.seconds || 0) > (current.timestamp?.seconds || 0)) ? prev : current)
            : {};
    };

    window.renderGradingShell = function(container,isAdmin,groupOptions=''){
        const currentMode = window._gradingViewMode || 'table';
        const graderSelectHtml = isAdmin
            ? `<div class="hidden md:block w-px h-5 bg-gray-200"></div>
               <div class="flex items-center gap-2 w-full md:w-auto shrink-0">
                    <div class="bg-blue-50 w-8 h-8 rounded-full flex items-center justify-center text-blue-600"><i class="fas fa-eye text-[10px]"></i></div>
                    <select id="grading-grader-select" onchange="window.renderGradingTables()" class="w-full md:w-48 border-none py-1.5 rounded-lg text-xs font-bold text-blue-700 outline-none cursor-pointer hover:bg-blue-50 transition"></select>
               </div>`
            : '';

        container.innerHTML = `
            <div class="bg-white p-4 rounded-t-2xl shadow-sm border border-gray-100 border-b-0 flex flex-col gap-3 z-[40] animate-fade-up">
                <div class="flex flex-col lg:flex-row items-stretch lg:items-center gap-3">
                    <div class="flex items-center gap-2 w-full md:w-auto shrink-0">
                        <div class="bg-red-50 w-8 h-8 rounded-full flex items-center justify-center text-red-800"><i class="fas fa-layer-group text-[10px]"></i></div>
                        <select id="grading-group-select" onchange="window.changeGradingGroup()" class="w-full md:w-56 border-none py-1.5 rounded-lg text-xs font-bold text-red-800 outline-none cursor-pointer hover:bg-red-50 transition">
                            ${groupOptions || '<option value="">-- Chọn nhóm --</option>'}
                        </select>
                    </div>
                    ${graderSelectHtml}
                    <div class="flex-1 relative w-full ml-auto lg:max-w-xs">
                        <i class="fas fa-search absolute left-3 top-2.5 text-gray-400 text-[11px]"></i>
                        <input type="text" id="filter-search" oninput="window.renderGradingTables()" placeholder="Tìm thí sinh nhanh..." class="w-full border border-gray-200 pl-8 pr-3 py-2 rounded-xl text-xs font-medium outline-none focus:ring-2 focus:ring-red-100 focus:border-red-500 transition bg-gray-50">
                    </div>
                    <div class="gs-view-switcher shrink-0">
                        <button class="gs-view-chip ${currentMode === 'table' ? 'active' : ''}" onclick="window.setGradingViewMode('table')"><i class="fas fa-table"></i> Xem bảng</button>
                        <button class="gs-view-chip ${currentMode === 'personal' ? 'active' : ''}" onclick="window.setGradingViewMode('personal')"><i class="fas fa-id-card"></i> Xem cá nhân</button>
                    </div>
                </div>
            </div>
            <div class="gs-content-tabs animate-fade-up" id="grader-content-tabs">
                <button class="gs-content-tab active" data-section="scores" onclick="window.showGraderSection('scores')"><i class="fas fa-table mr-1"></i> 1. Tiêu chí chấm điểm</button>
                <button class="gs-content-tab" data-section="scoring" onclick="window.showGraderSection('scoring')"><i class="fas fa-book-open mr-1"></i> Nội dung tiêu chí chấm</button>
                <button class="gs-content-tab" data-section="interview" onclick="window.showGraderSection('interview')"><i class="fas fa-file-alt mr-1"></i> Câu hỏi phỏng vấn</button>
            </div>
            <div id="grader-section-panel" style="display:none" class="flex-1 min-h-0 overflow-y-auto custom-scrollbar"></div>
            <div id="grading-score-panel" class="flex-1 flex flex-col min-h-0 animate-fade-up"><div id="grading-tables-container" class="flex-1 flex flex-col min-h-0"></div></div>
        `;
        window._renderGradingUIInternal = window.renderGradingTables;
    };

    window.changeGradingGroup = function() {
        const isAdmin = window.currentUserData.role === 'SuperAdmin' || window.currentUserData.role === 'Admin';
        const groupSelect = document.getElementById('grading-group-select');
        window._selectedGradingGroupId = groupSelect?.value || null;
        window._selectedGradingCandidateId = null;
        if(isAdmin && window._allGradersCache) {
            const graderSelect = document.getElementById('grading-grader-select');
            let opts = '';
            window._allGradersCache.forEach(u => {
                if(u.assignedGroups && u.assignedGroups.includes(window._selectedGradingGroupId)) {
                    opts += `<option value="${u.code}">${window.escapeHtml(u.name)} - ${window.escapeHtml(u.code)}</option>`;
                }
            });
            if (graderSelect) { graderSelect.innerHTML = opts || '<option value="">-- Trống Giám khảo --</option>'; }
        }
        window.renderGradingTables();
        const g = window._groupMapCache?.[window._selectedGradingGroupId];
        const sc = g && window.isGroupPublishedForGrader(g) ? window.getSectionAccess(g,'scoringContent') : {enabled:false};
        const iv = g && window.isGroupPublishedForGrader(g) ? window.getSectionAccess(g,'interviewContent') : {enabled:false};
        const sb=document.querySelector('.gs-content-tab[data-section="scoring"]');
        const ib=document.querySelector('.gs-content-tab[data-section="interview"]');
        if(sb) sb.style.display=sc.enabled?'block':'none';
        if(ib) ib.style.display=iv.enabled?'block':'none';
        window.showGraderSection('scores');
    };

    window.renderGradingTables = function() {
        const container = document.getElementById('grading-tables-container');
        if(!container) return;

        const oldScrollHost = container.querySelector('.sticky-table-container, .gs-candidate-list-body, .gs-personal-scroll');
        const savedScrollTop = oldScrollHost ? oldScrollHost.scrollTop : container.scrollTop;
        const savedScrollLeft = oldScrollHost ? oldScrollHost.scrollLeft : container.scrollLeft;
        const restoreScroll = () => {
            const host = container.querySelector('.sticky-table-container, .gs-candidate-list-body, .gs-personal-scroll');
            if(!host) return;
            host.scrollTop = savedScrollTop;
            host.scrollLeft = savedScrollLeft;
        };

        const searchInput = document.getElementById('filter-search');
        const searchKeyword = (searchInput ? searchInput.value : '').toLowerCase();
        const isAdmin = window.currentUserData.role === 'SuperAdmin' || window.currentUserData.role === 'Admin';
        let gId = window._selectedGradingGroupId;
        if(!gId && !isAdmin){
            const assigned=window._seedAssignedGroupPlaceholders?.()||[];
            if(assigned.length){ gId=assigned[0]; window._selectedGradingGroupId=gId; }
        }
        if(!gId){
            container.innerHTML = '<div class="bg-white p-8 rounded-b-2xl text-center text-gray-400 border border-gray-100 border-t-0 shadow-sm text-xs">Chưa được phân quyền nhóm.</div>';
            return;
        }
        if(!window._groupMapCache[gId]){
            const rt=window._graderRealtime;
            if(rt?.started && !rt.publicationReady){
                container.innerHTML = '<div class="bg-white p-8 rounded-b-2xl text-center text-gray-400 border border-gray-100 border-t-0 shadow-sm text-xs"><i class="fas fa-sync fa-spin mr-2"></i>Đang tải dữ liệu nhóm...</div>';
            }else{
                container.innerHTML = '<div class="bg-white p-8 rounded-b-2xl text-center text-amber-600 border border-amber-100 border-t-0 shadow-sm text-xs">Đang tải cấu hình nhóm...</div>';
            }
            return;
        }

        const groupInfo = window._groupMapCache[gId];
        const timeStatus = window.getGroupTimeStatus(groupInfo);
        if(!isAdmin && !window._isGroupGateOpenLocal(groupInfo)){
            const st = window.getPublicationStatus(groupInfo);
            container.innerHTML = `<div class="bg-white p-10 rounded-2xl border border-amber-100 text-center text-gray-600"><i class="fas fa-clock text-3xl text-amber-500 mb-3"></i><p class="font-black text-gray-800">${window.escapeHtml(groupInfo.name||'Nhóm chấm')}</p><p class="font-bold mt-1">${window.escapeHtml(st.label)}</p><p class="text-xs text-gray-500 mt-2">${window.escapeHtml(st.detail)}</p><p class="text-[10px] text-gray-400 mt-3">Nhóm vẫn luôn hiển thị vì bạn đã được Admin phân quyền.</p></div>`;
            return;
        }

        const targetGraderCode = isAdmin ? document.getElementById('grading-grader-select')?.value : window.currentUserData.code;
        let groupCands = (window._allCandidatesCache || []).filter(c => c.groupId === gId);
        if(searchKeyword) {
            groupCands = groupCands.filter(c => (c.name && c.name.toLowerCase().includes(searchKeyword)) || (c.code && c.code.toLowerCase().includes(searchKeyword)));
        }
        if (!isAdmin) {
            groupCands = groupCands
                .map((cand, originalIndex) => ({ cand, originalIndex }))
                .sort((a, b) => {
                    const ap = a.cand.isPresent === true || a.cand.isPresent === 1 || a.cand.isPresent === 'true' || a.cand.isPresent === '1';
                    const bp = b.cand.isPresent === true || b.cand.isPresent === 1 || b.cand.isPresent === 'true' || b.cand.isPresent === '1';
                    if (ap && bp) {
                        const ao = Number(a.cand.attendanceOrder || 0);
                        const bo = Number(b.cand.attendanceOrder || 0);
                        if (ao !== bo) return bo - ao;
                        return a.originalIndex - b.originalIndex;
                    }
                    if (ap !== bp) return Number(bp) - Number(ap);
                    return a.originalIndex - b.originalIndex;
                })
                .map(x => x.cand);
        }
        if(groupCands.length === 0) {
            container.innerHTML = '<div class="bg-white p-8 rounded-b-2xl shadow-sm border border-gray-100 border-t-0 text-center text-gray-400 text-xs">Không có thí sinh.</div>';
            return;
        }

        const verifyInfo = (window._allVerificationsCache || {})[`${targetGraderCode}_${gId}`];
        const isVerified = verifyInfo ? verifyInfo.isVerified : false;
        const globalDisable = isVerified || isAdmin || !timeStatus.active || !targetGraderCode;
        const shownExtraFields = (groupInfo.extraFields || []).filter(f => isAdmin || f.showToGrader);
        const criteriaList = groupInfo.criteria || [];
        window._gradedDataCache = window._gradedDataCache || {};

        const candidateViews = groupCands.map((cand, index) => {
            const graded = window.getLatestScoreRecordForCandidate(cand.id, targetGraderCode);
            window._gradedDataCache[cand.id] = graded;
            const scoresObj = graded.scores || {};
            const totalScore = Number(graded.totalScore || 0);
            const hasScore = !!graded.candidateId && Object.keys(scoresObj).length > 0;
            const isPass = totalScore >= Number(groupInfo.passScore || 0);
            const present = cand.isPresent === true || cand.isPresent === 1 || cand.isPresent === 'true' || cand.isPresent === '1';
            const candInputDisabled = globalDisable || (groupInfo.attendanceEnabled && !present);
            const candExtraData = cand.extraData || {};
            return { cand, index, graded, scoresObj, totalScore, hasScore, isPass, present, candInputDisabled, candExtraData };
        });

        if(!candidateViews.some(v => v.cand.id === window._selectedGradingCandidateId)){
            const preferred = candidateViews.find(v => v.present) || candidateViews[0];
            window._selectedGradingCandidateId = preferred ? preferred.cand.id : null;
        }

        let actionButtons = '';
        if (isAdmin) {
            const graderText = targetGraderCode ? `<span class="text-blue-700">${targetGraderCode}</span>` : `<span class="text-rose-500">Trống</span>`;
            actionButtons = `<div class="text-[11px] font-bold text-gray-500 bg-gray-100 px-3 py-2 rounded-lg border border-gray-200 w-full sm:w-auto"><i class="fas fa-eye text-blue-500 mr-1"></i> Xem điểm của: ${graderText} ${isVerified ? '<span class="text-emerald-600 ml-1">(Đã khóa)</span>' : ''}</div>`;
        } else {
            const graderNameDisplay = `<div class="text-[11px] font-bold text-red-800 bg-red-50 px-3 py-2 rounded-lg border border-red-100 hidden sm:block"><i class="fas fa-user-edit mr-1"></i> Giám khảo: ${window.escapeHtml(window.currentUserData.name)}</div>`;
            if (!timeStatus.active) {
                actionButtons = `${graderNameDisplay} <div class="text-[11px] font-bold text-${timeStatus.color}-700 bg-${timeStatus.color}-50 px-3 py-2 rounded-lg border border-${timeStatus.color}-200 flex items-center whitespace-normal w-full max-w-[220px]"><i class="fas ${timeStatus.icon} mr-1"></i> ${timeStatus.text}</div>`;
            } else if (!isVerified) {
                actionButtons = `${graderNameDisplay} <button onclick="window.verifyGroupGrading('${gId}')" class="bg-red-800 hover:bg-red-900 text-white font-bold px-4 py-2 rounded-lg text-xs transition-all shadow-md flex items-center gap-2 btn-press whitespace-nowrap"><i class="fas fa-lock"></i> Khóa Nộp</button>`;
            } else {
                actionButtons = `${graderNameDisplay} <div class="flex items-center gap-1.5 bg-emerald-50 border border-emerald-200 text-emerald-700 px-3 py-2 rounded-lg text-xs font-bold whitespace-nowrap"><i class="fas fa-check-double"></i> Đã nộp</div>`;
            }
        }

        const timeBadge = `<span class="bg-${timeStatus.color}-100 text-${timeStatus.color}-700 px-2 py-0.5 rounded text-[10px] font-bold shadow-sm border border-${timeStatus.color}-200 ml-2 whitespace-nowrap"><i class="fas ${timeStatus.icon} mr-1"></i> ${timeStatus.text}</span>`;
        const attBadge = groupInfo.attendanceEnabled ? `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-[10px] font-bold shadow-sm border border-blue-200 ml-2 whitespace-nowrap"><i class="fas fa-user-check"></i> Có Đ.Danh</span>` : '';
        const buildStatusBadge = (view) => {
            if(!view.hasScore) return '<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[9px] font-medium border border-gray-200">CHỜ</span>';
            return view.isPass
                ? '<span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px] font-bold border border-emerald-200">PASS</span>'
                : '<span class="bg-rose-50 text-rose-600 px-2 py-1 rounded text-[10px] font-bold border border-rose-200">FAIL</span>';
        };

        if((window._gradingViewMode || 'table') === 'personal') {
            const selected = candidateViews.find(v => v.cand.id === window._selectedGradingCandidateId) || candidateViews[0];
            const candidate = selected.cand;
            const statusBadge = buildStatusBadge(selected);
            const attendanceBadge = groupInfo.attendanceEnabled
                ? (selected.present ? '<span class="gs-pill green"><i class="fas fa-user-check"></i> Có mặt</span>' : '<span class="gs-pill amber"><i class="fas fa-user-clock"></i> Chờ điểm danh</span>')
                : '<span class="gs-pill gray"><i class="fas fa-list-check"></i> Không dùng điểm danh</span>';

            const listHtml = candidateViews.map((view, idx) => {
                const active = view.cand.id === selected.cand.id;
                const miniBadge = view.hasScore ? (view.isPass ? '<span class="gs-pill green">PASS</span>' : '<span class="gs-pill amber">FAIL</span>') : '<span class="gs-pill gray">CHỜ</span>';
                const presence = groupInfo.attendanceEnabled ? (view.present ? '<span class="text-[10px] font-black text-emerald-700">• Có mặt</span>' : '<span class="text-[10px] font-bold text-gray-400">• Chưa điểm danh</span>') : '';
                const totalShort = Number(view.totalScore || 0).toFixed(2).replace(/\.00$/,'');
                return `<button type="button" onclick="window.selectGradingCandidate('${view.cand.id}')" class="gs-candidate-item ${active ? 'active' : ''}"><div class="min-w-0 text-left"><div class="flex items-start gap-2"><span class="text-[10px] font-black text-gray-400 mt-0.5">${idx + 1}.</span><div class="min-w-0"><div class="gs-candidate-item-name truncate">${window.escapeHtml(view.cand.name || 'Thí sinh')}</div><div class="gs-candidate-item-code">${window.escapeHtml(view.cand.code || '---')} ${presence}</div></div></div></div><div class="shrink-0 text-right"><div class="gs-mini-kpi"><span class="value">${totalShort}</span></div><div class="mt-2">${miniBadge}</div></div></button>`;
            }).join('');

            const baseFields = [
                {label:'Mã số / SBD', value:candidate.code || '---'},
                {label:'Họ tên', value:candidate.name || '---'}
            ];
            shownExtraFields.forEach(f => baseFields.push({label:f.name, value:(selected.candExtraData || {})[f.name] || '-'}));
            const fieldsHtml = baseFields.map(f => `<div class="gs-readonly-field"><label>${window.escapeHtml(f.label)}</label><div class="gs-readonly-box">${window.escapeHtml(String(f.value ?? '-'))}</div></div>`).join('');

            const criteriaHtml = criteriaList.map((crit, idx) => {
                const val = selected.scoresObj[crit.name] !== undefined ? selected.scoresObj[crit.name] : '';
                return `<div class="gs-score-card"><div class="gs-score-row"><div><div class="text-[14px] font-black text-gray-900">${window.escapeHtml(crit.name)}</div><div class="gs-score-note">Trọng số: <b>${crit.weight}%</b> · Nhập điểm từ 0 đến 100.</div></div><div><input type="number" id="score-${candidate.id}-${idx}" data-cand="${candidate.id}" data-group="${gId}" data-pass="${groupInfo.passScore}" data-crit="${window.escapeHtml(crit.name)}" data-weight="${crit.weight}" min="0" max="100" step="0.5" value="${val}" ${selected.candInputDisabled ? 'disabled' : ''} oninput="if(this.value>100)this.value=100; if(this.value<0)this.value=0; window.autoSaveScore('${candidate.id}','${gId}',${groupInfo.passScore})" class="score-input gs-score-input-lg" placeholder="-"></div></div></div>`;
            }).join('');

            let disabledBanner = '';
            if (selected.candInputDisabled) {
                const message = !timeStatus.active
                    ? `Nhóm hiện chưa trong thời gian chấm. Trạng thái: ${timeStatus.text}.`
                    : (isVerified ? 'Bảng điểm đã khóa/nộp. Bạn chỉ có thể xem thông tin thí sinh.' : 'Thí sinh này chưa được điểm danh nên tạm khóa ô nhập điểm.');
                disabledBanner = `<div class="gs-mode-banner ${(!timeStatus.active || isVerified) ? 'amber' : 'blue'}">${message}</div>`;
            }

            container.innerHTML = `
                <div class="bg-white p-1 rounded-b-2xl shadow-sm border border-gray-100 border-t-0 flex flex-col h-full relative">
                    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center p-4 border-b border-gray-100 gap-4 shrink-0 bg-gray-50/50 mx-1 mt-1 rounded-t-xl">
                        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                            <h3 class="text-base font-black text-red-800 uppercase flex items-center flex-wrap gap-1 w-full md:w-auto"><i class="fas fa-folder-open mr-1"></i>${window.escapeHtml(groupInfo.name)} ${timeBadge} ${attBadge}</h3>
                            <span class="bg-white text-gray-600 px-2 py-1 rounded text-[11px] font-bold border border-gray-200 ml-2">Điểm Pass: ≥ ${groupInfo.passScore} đ</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-start lg:justify-end">${actionButtons}</div>
                    </div>
                    <div class="gs-grader-split p-3 flex-1 min-h-0">
                        <div class="gs-candidate-list-card min-h-0">
                            <div class="gs-candidate-list-head">
                                <div class="flex items-center justify-between gap-3">
                                    <div>
                                        <div class="text-[10px] font-black uppercase tracking-[0.18em] text-gray-400">Danh sách thí sinh</div>
                                        <div class="text-xl font-black text-gray-900 mt-1">Thông tin thí sinh</div>
                                    </div>
                                    <div class="gs-list-counter">${candidateViews.length} thí sinh</div>
                                </div>
                            </div>
                            <div class="gs-candidate-list-body custom-scrollbar">${listHtml}</div>
                        </div>
                        <div class="gs-candidate-detail-card flex flex-col min-h-0">
                            <div class="gs-detail-head">
                                <div class="flex flex-col lg:flex-row justify-between gap-4">
                                    <div>
                                        <div class="inline-flex items-center px-3 py-1 rounded-full bg-gray-50 text-gray-600 text-[11px] font-black border border-gray-200">Thí sinh</div>
                                        <h3 class="text-[20px] font-black text-gray-900 mt-2">${window.escapeHtml(candidate.name || '')}</h3>
                                        <div class="text-gray-500 font-bold mt-1">${window.escapeHtml(candidate.code || '---')}</div>
                                    </div>
                                    <div class="flex items-center gap-2 self-start">${statusBadge} ${attendanceBadge}</div>
                                </div>
                            </div>
                            <div class="gs-detail-meta">
                                <div class="gs-info-stat"><div class="gs-info-stat-label">Điểm tổng</div><div class="gs-info-stat-value" id="tot-${candidate.id}">${selected.totalScore}</div><div id="save-status-${candidate.id}" class="text-[10px] text-emerald-600 font-bold mt-2 opacity-0 transition-opacity">Đã lưu</div></div>
                                <div class="gs-info-stat"><div class="gs-info-stat-label">Kết quả</div><div class="gs-info-stat-value" id="status-container-${candidate.id}">${statusBadge}</div></div>
                                <div class="gs-info-stat"><div class="gs-info-stat-label">Điểm pass</div><div class="gs-info-stat-value">≥ ${groupInfo.passScore}</div></div>
                                <div class="gs-info-stat"><div class="gs-info-stat-label">Trạng thái</div><div class="gs-info-stat-value text-[14px]">${timeStatus.text}</div></div>
                            </div>
                            ${disabledBanner}
                            <div class="gs-detail-body gs-personal-scroll overflow-y-auto custom-scrollbar">
                                <div class="gs-candidate-fields">${fieldsHtml}</div>
                                <div class="border-t border-gray-100 pt-5">
                                    <div class="text-[10px] font-black uppercase tracking-[0.2em] text-red-700 mb-3">Bảng chấm cá nhân</div>
                                    ${criteriaHtml || '<div class="gs-empty-view">Chưa có tiêu chí chấm điểm cho nhóm này.</div>'}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            requestAnimationFrame(restoreScroll);
            setTimeout(restoreScroll, 0);
            return;
        }

        let tableHeaders = `<th class="py-3 px-3 text-center border-b border-gray-200 w-10 whitespace-nowrap shadow-sm z-20">STT</th><th class="py-3 px-3 text-center border-b border-gray-200 w-16 whitespace-nowrap shadow-sm z-20">SBD</th><th class="py-3 px-3 text-center border-b border-gray-200 whitespace-nowrap min-w-[200px] shadow-sm z-20">Thí Sinh</th>`;
        if(groupInfo.attendanceEnabled) tableHeaders += `<th class="py-3 px-3 text-center border-b border-gray-200 w-16 whitespace-nowrap shadow-sm z-20 bg-blue-50/50 text-blue-800"><i class="fas fa-user-check"></i> Có Mặt</th>`;
        shownExtraFields.forEach(f => { tableHeaders += `<th class="py-3 px-3 text-center border-b border-gray-200 whitespace-nowrap shadow-sm z-20 bg-gray-50 text-gray-600 font-bold">${window.escapeHtml(f.name)}</th>`; });
        criteriaList.forEach(crit => { tableHeaders += `<th class="py-2 px-3 text-center border-l border-b border-gray-200 bg-gray-50/90 whitespace-nowrap shadow-sm z-20 min-w-[90px]"><span class="font-bold text-gray-700 text-[11px]">${window.escapeHtml(crit.name)}</span><br><span class="text-[9px] text-red-800 font-bold bg-red-50 px-1.5 py-0.5 rounded mt-1 inline-block">TS: ${crit.weight}%</span></th>`; });
        tableHeaders += `<th class="py-3 px-3 text-center border-l border-b border-gray-200 w-20 whitespace-nowrap shadow-sm z-20">Tổng</th><th class="py-3 px-3 text-center border-b border-gray-200 w-24 whitespace-nowrap shadow-sm z-20">Kết quả</th>`;

        const tableRows = candidateViews.map((view) => {
            const {cand, index, scoresObj, totalScore, hasScore, isPass, present, candInputDisabled, candExtraData} = view;
            let attendanceHtml = '';
            if(groupInfo.attendanceEnabled) {
                if(isAdmin) {
                    attendanceHtml = `<td class="py-3 px-2 text-center align-middle bg-blue-50/20"><input type="checkbox" onchange="window.toggleCandAttendance('${cand.id}', this.checked)" class="w-4 h-4 rounded accent-blue-600 cursor-pointer" ${present ? 'checked' : ''}></td>`;
                } else {
                    attendanceHtml = `<td class="py-3 px-2 text-center align-middle ${present ? 'bg-emerald-100/70' : 'bg-blue-50/20'}">${present ? '<span class="text-[10px] font-black text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full inline-flex items-center gap-1"><i class="fas fa-circle text-[6px]"></i> CÓ MẶT</span>' : '<span class="text-[10px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded">Chờ điểm danh</span>'}</td>`;
                }
            }
            const extraHtml = shownExtraFields.map(f => `<td class="py-3 px-3 text-center align-middle text-[11px] text-gray-700 whitespace-nowrap break-words">${window.escapeHtml((candExtraData || {})[f.name] || '-')}</td>`).join('');
            const criteriaInputs = criteriaList.map((crit, idx) => {
                const val = scoresObj[crit.name] !== undefined ? scoresObj[crit.name] : '';
                return `<td class="py-2 px-2 text-center border-l border-gray-100 hover:bg-gray-50/50 transition"><input type="number" id="score-${cand.id}-${idx}" data-cand="${cand.id}" data-group="${gId}" data-pass="${groupInfo.passScore}" data-crit="${window.escapeHtml(crit.name)}" data-weight="${crit.weight}" min="0" max="100" step="0.5" value="${val}" ${candInputDisabled ? 'disabled' : ''} oninput="if(this.value>100)this.value=100; if(this.value<0)this.value=0; window.autoSaveScore('${cand.id}','${gId}',${groupInfo.passScore})" class="score-input w-16 mx-auto border border-gray-300 p-2 rounded-lg text-center text-xs font-bold text-red-800 outline-none focus:border-red-600 focus:bg-red-50 ${candInputDisabled ? 'bg-gray-100 text-gray-400 cursor-not-allowed border-transparent shadow-inner opacity-60' : 'bg-white shadow-sm hover:border-red-400 transition-all duration-300'}" placeholder="-"></td>`;
            }).join('');
            const presentRowClass = (!isAdmin && groupInfo.attendanceEnabled && present) ? 'bg-emerald-50/80 ring-1 ring-inset ring-emerald-200' : 'hover:bg-red-50/20';
            const presentNameBadge = (!isAdmin && groupInfo.attendanceEnabled && present) ? '<span class="ml-2 inline-flex items-center gap-1 text-[8px] font-black uppercase text-emerald-700 bg-white border border-emerald-200 px-1.5 py-0.5 rounded-full"><i class="fas fa-arrow-up"></i> ĐANG THI</span>' : '';
            return `<tr class="${presentRowClass} border-b border-gray-100 transition-all duration-300 group"><td class="py-3 px-2 font-semibold text-gray-500 text-[11px] text-center align-middle">${index + 1}</td><td class="py-3 px-2 font-mono text-gray-600 text-[11px] text-center align-middle font-bold">${window.escapeHtml(cand.code) || '---'}</td><td class="py-3 px-3 text-center align-middle"><p class="font-bold ${present && !isAdmin ? 'text-emerald-900' : 'text-gray-900'} text-xs">${window.escapeHtml(cand.name)}${presentNameBadge}</p></td>${attendanceHtml}${extraHtml}${criteriaInputs}<td class="py-3 px-2 text-center border-l border-gray-100 relative align-middle"><span class="font-bold text-base ${isPass ? 'text-emerald-600' : (hasScore ? 'text-rose-600' : 'text-gray-400')}" id="tot-${cand.id}">${totalScore}</span><div id="save-status-${cand.id}" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 text-[8px] text-emerald-600 font-bold opacity-0 transition-opacity">Đã lưu</div></td><td class="py-3 px-2 text-center align-middle" id="status-container-${cand.id}">${buildStatusBadge(view)}</td></tr>`;
        }).join('');

        container.innerHTML = `<div class="bg-white p-1 rounded-b-2xl shadow-sm border border-gray-100 border-t-0 flex flex-col h-full relative"><div class="flex flex-col lg:flex-row justify-between items-start lg:items-center p-4 border-b border-gray-100 gap-4 shrink-0 bg-gray-50/50 mx-1 mt-1 rounded-t-xl"><div class="flex flex-wrap items-center gap-2 w-full lg:w-auto"><h3 class="text-base font-black text-red-800 uppercase flex items-center flex-wrap gap-1 w-full md:w-auto"><i class="fas fa-folder-open mr-1"></i>${window.escapeHtml(groupInfo.name)} ${timeBadge} ${attBadge}</h3><span class="bg-white text-gray-600 px-2 py-1 rounded text-[11px] font-bold border border-gray-200 ml-2">Điểm Pass: ≥ ${groupInfo.passScore} đ</span></div><div class="flex flex-wrap items-center gap-2 w-full lg:w-auto justify-start lg:justify-end">${actionButtons}</div></div><div class="w-full custom-scrollbar sticky-table-container rounded-b-2xl flex-1 pb-1"><table class="w-full text-left text-sm border-collapse min-w-max"><thead><tr>${tableHeaders}</tr></thead><tbody>${tableRows}</tbody></table></div></div>`;
        requestAnimationFrame(restoreScroll);
        setTimeout(restoreScroll, 0);
    };
})();
</script>


<script type="module" id="v21-permission-sync-fix">
(function(){
    // V21: mặc định mở giao diện cá nhân để BGK thấy ngay sự thay đổi thiết kế.
    if(!localStorage.getItem('gradeSyncGradingViewMode')){
        localStorage.setItem('gradeSyncGradingViewMode','personal');
    }
    window._gradingViewMode = localStorage.getItem('gradeSyncGradingViewMode') || 'personal';

    // Cập nhật selector + màn hình ngay khi quyền thay đổi, không chờ sync session.
    window.startGraderRealtime = function(){
        if(window.currentUserData?.role!=='Grader') return;
        window.stopGraderRealtime(false);
        const rt=window._graderRealtime;
        rt.started=true;
        rt.assigned=Array.isArray(window.currentUserData.assignedGroups)?window.currentUserData.assignedGroups:[];
        const uid=window.currentUserData.id;

        // Bắt đầu nghe ngay nhóm hiện có.
        window.refreshAssignedGroupSubscriptions();

        if(uid){
            rt.unsubUser=window.onSnapshot(window.doc(window.db,'users',uid),snap=>{
                if(!snap.exists()){
                    window.showToast('Tài khoản giám khảo đã bị thu hồi.','error');
                    return window.handleLogout();
                }
                const d=snap.data()||{};
                const old=(rt.assigned||[]).slice().sort().join('|');
                const next=Array.isArray(d.assignedGroups)?d.assignedGroups:[];

                window.currentUserData={...window.currentUserData,...d,id:uid,code:window.currentUserData.code};
                rt.assigned=next;
                try{ localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData)); }catch(_e){}

                if(d.status==='Inactive'){
                    window.showToast('Thẻ giám khảo đã bị khóa bởi Admin.','error');
                    return window.handleLogout();
                }

                // QUAN TRỌNG: cập nhật quyền & subscribe nhóm NGAY LẬP TỨC.
                // Không await syncGraderSession vì nếu write session chậm thì UI vẫn phải realtime.
                window.refreshAssignedGroupSubscriptions();
                window.refreshGraderGroupSelector?.();
                window._rerenderGraderRealtime?.();

                // Đồng bộ session chạy nền để không chặn giao diện.
                Promise.resolve(window.syncGraderSession(true,'permissions-updated')).catch(err=>{
                    console.warn('GRADER SESSION BACKGROUND SYNC:',err);
                });

                const changed=old!==next.slice().sort().join('|');
                if(changed){
                    const added=next.filter(x=>!old.split('|').filter(Boolean).includes(x));
                    const removed=old.split('|').filter(Boolean).filter(x=>!next.includes(x));
                    let msg='Phân quyền nhóm vừa được cập nhật realtime.';
                    if(added.length && !removed.length) msg='Admin vừa cấp thêm nhóm chấm. Nhóm đã xuất hiện ngay.';
                    if(removed.length && !added.length) msg='Admin vừa rút quyền nhóm chấm. Giao diện đã cập nhật ngay.';
                    window.showToast(msg);
                }
            },err=>{
                console.warn('Realtime user permissions error:',err);
                window.showToast('Mất đồng bộ phân quyền với Admin. Hệ thống sẽ tự thử lại khi kết nối ổn định.','error');
            });
        }

        Promise.resolve(window.syncGraderSession(true,'realtime-start')).catch(err=>{
            console.warn('GRADER SESSION START SYNC:',err);
        });
    };

    // V21: BGK luôn khởi động realtime, kể cả lúc hiện tại chưa có nhóm.
    // Nhờ vậy Admin cấp nhóm sau đó -> BGK thấy ngay mà KHÔNG cần F5.
    window.loadGradingTable = async function(container) {
        try{
            if(!window.currentUserData?.code) return window.renderErrorState(container,'Phiên đăng nhập không hợp lệ.');
            const isAdmin=['Admin','SuperAdmin'].includes(window.currentUserData.role);

            if(!isAdmin){
                if(!window._graderRealtime?.started) window.startGraderRealtime();

                const ids=(window._allowedGroupIdsCache||[]).filter(id=>window._groupMapCache?.[id]);
                const opts=ids.map(id=>`<option value="${id}">${window.escapeHtml(window._groupMapCache[id]?.name||id)}</option>`).join('');
                window.renderGradingShell(container,false,opts || '<option value="">-- Chờ Admin phân quyền nhóm --</option>');
                window.refreshGraderGroupSelector();
                window.startGroupContentClock();
                setTimeout(()=>window.renderGradingTables(),0);
                return;
            }

            const [gSnap,uSnap]=await Promise.all([
                window.getDocs(window.collection(window.db,'competition_groups')),
                window.getDocs(window.query(window.collection(window.db,'users'),window.where('role','==','Grader')))
            ]);
            window._groupMapCache={}; const ids=[]; let opts='';
            gSnap.forEach(ds=>{const g={id:ds.id,...ds.data()};window._groupMapCache[ds.id]=g;ids.push(ds.id);opts+=`<option value="${ds.id}">${window.escapeHtml(g.name||'')}</option>`;});
            window._allGradersCache=[];uSnap.forEach(ds=>window._allGradersCache.push({id:ds.id,...ds.data()}));
            window._allowedGroupIdsCache=ids;window._selectedGradingGroupId=ids[0]||null;
            window.renderGradingShell(container,true,opts);

            const unsubGroup=window.onSnapshot(window.collection(window.db,'competition_groups'),snap=>{
                const map={};snap.forEach(ds=>map[ds.id]={id:ds.id,...ds.data()});window._groupMapCache=map;
                if(window._renderGradingUIInternal)window._renderGradingUIInternal();
            });window.activeListeners.push(unsubGroup);
            const unsubScores=window.onSnapshot(window.collection(window.db,'scores'),snap=>{
                const arr=[];snap.forEach(ds=>arr.push({id:ds.id,...ds.data()}));window._allScoresCache=arr;
                if(window._renderGradingUIInternal)window._renderGradingUIInternal();
            });window.activeListeners.push(unsubScores);
            const unsubVerify=window.onSnapshot(window.collection(window.db,'grader_verifications'),snap=>{
                const m={};snap.forEach(ds=>{const d=ds.data();m[`${d.graderCode}_${d.groupId}`]={id:ds.id,...d};});window._allVerificationsCache=m;
                if(window._renderGradingUIInternal)window._renderGradingUIInternal();
            });window.activeListeners.push(unsubVerify);
            const unsubCands=window.onSnapshot(window.collection(window.db,'candidates'),snap=>{
                const arr=[];snap.forEach(ds=>arr.push({id:ds.id,...ds.data()}));window._allCandidatesCache=arr;
                if(window._renderGradingUIInternal)window._renderGradingUIInternal();
            });window.activeListeners.push(unsubCands);
            window.startGroupContentClock();setTimeout(()=>window.changeGradingGroup(),0);
        }catch(e){window.renderErrorState(container,e.message||String(e));}
    };

    // Admin lưu phân quyền: ghi timestamp/version để mọi client nhận snapshot mới rõ ràng.
    window.saveGraderEdit = async function(userId) {
        const newName = document.getElementById('edit-grader-name-modal').value.trim();
        if(!newName) { window.showToast('Tên không được để trống!','error'); return; }
        const assignedGroups=[];
        document.querySelectorAll('.grader-edit-chk-modal:checked').forEach(chk=>assignedGroups.push(chk.value));
        window.closeCustomModal();
        window.showLoading(true,'Đang đồng bộ phân quyền...');
        try{
            const ref=window.doc(window.db,'users',userId);
            const snap=await window.getDoc(ref);
            const oldVersion=snap.exists()?Number(snap.data()?.permissionsVersion||0):0;
            await window.setDoc(ref,{
                name:window.cleanTextForStore(newName),
                assignedGroups,
                permissionsVersion:oldVersion+1,
                permissionsUpdatedAt:window.serverTimestamp(),
                updatedAt:window.serverTimestamp()
            },{merge:true});
            window.showToast('Đã đồng bộ phân quyền. BGK đang online sẽ thấy thay đổi ngay.');
            await window.loadAccountManager(document.getElementById('main-content'));
        }catch(e){
            console.error('SAVE GRADER PERMISSIONS:',e);
            window.showToast('Không thể cập nhật phân quyền: '+(e.message||e.code),'error');
        }finally{ window.showLoading(false); }
    };
})();
</script>

<script type="module" id="v24-attendance-ultra-realtime">
(function(){
    // V24: kênh điểm danh realtime nhẹ, không polling.
    // Mỗi nhóm mở chỉ thêm 1 listener document nhỏ attendance_realtime/{groupId}.
    const rt = window._graderRealtime = window._graderRealtime || {};
    rt.unsubAttendance = rt.unsubAttendance || new Map();
    rt.lastAttendanceEvent = rt.lastAttendanceEvent || new Map();
    rt.pendingAttendance = rt.pendingAttendance || new Map();

    const oldStopRealtime = window.stopGraderRealtime;
    window.stopGraderRealtime = function(clearCaches=true){
        try{
            rt.unsubAttendance?.forEach(u=>{ try{u?.();}catch(_e){} });
            rt.unsubAttendance?.clear?.();
            rt.lastAttendanceEvent?.clear?.();
            rt.pendingAttendance?.clear?.();
        }catch(_e){}
        return oldStopRealtime ? oldStopRealtime(clearCaches) : undefined;
    };

    window._attendanceValue = function(v){
        return v === true || v === 1 || v === 'true' || v === '1';
    };

    window._patchAttendanceCache = function(candidateId, isPresent, attendanceOrder, updatedAt){
        const idx=(window._allCandidatesCache||[]).findIndex(c=>c.id===candidateId);
        if(idx<0){
            rt.pendingAttendance.set(candidateId,{candidateId,isPresent:!!isPresent,attendanceOrder:Number(attendanceOrder||0),updatedAt});
            return false;
        }
        const prev=window._allCandidatesCache[idx];
        window._allCandidatesCache[idx]={...prev,isPresent:!!isPresent,attendanceOrder:Number(attendanceOrder||0),attendanceUpdatedAt:updatedAt||prev.attendanceUpdatedAt};
        return true;
    };

    // Cập nhật DOM tối thiểu cho view bảng để không render lại cả bảng.
    window._applyAttendanceDomFast = function(candidateId, isPresent){
        try{
            const scoreInput=document.querySelector(`input.score-input[data-cand="${CSS.escape(candidateId)}"]`);
            const row=scoreInput?.closest('tr');
            if(!row) return false;

            const groupId=scoreInput?.dataset?.group;
            const groupInfo=window._groupMapCache?.[groupId]||{};
            if(groupInfo.attendanceEnabled){
                const inputs=row.querySelectorAll('input.score-input');
                inputs.forEach(inp=>{
                    if(window.currentUserData?.role==='Grader') inp.disabled=!isPresent;
                    if(isPresent){
                        inp.classList.remove('bg-gray-100','text-gray-400','cursor-not-allowed','opacity-60');
                        inp.classList.add('bg-white','shadow-sm');
                    }else{
                        inp.classList.add('bg-gray-100','text-gray-400','cursor-not-allowed','opacity-60');
                        inp.classList.remove('bg-white','shadow-sm');
                    }
                });

                const cells=[...row.children];
                // Cột điểm danh luôn nằm sau STT, SBD, Tên khi attendanceEnabled.
                const attendanceCell=cells[3];
                if(attendanceCell){
                    attendanceCell.className=`py-3 px-2 text-center align-middle ${isPresent?'bg-emerald-100/70':'bg-blue-50/20'}`;
                    attendanceCell.innerHTML=isPresent
                        ? '<span class="text-[10px] font-black text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full inline-flex items-center gap-1"><i class="fas fa-circle text-[6px]"></i> CÓ MẶT</span>'
                        : '<span class="text-[10px] font-bold text-gray-400 bg-gray-50 px-2 py-1 rounded">Chờ điểm danh</span>';
                }

                const nameP=cells[2]?.querySelector('p');
                if(nameP){
                    const oldBadge=nameP.querySelector('.v24-present-badge');
                    oldBadge?.remove();
                    if(isPresent){
                        nameP.classList.remove('text-gray-900');
                        nameP.classList.add('text-emerald-900');
                        nameP.insertAdjacentHTML('beforeend','<span class="v24-present-badge ml-2 inline-flex items-center gap-1 text-[8px] font-black uppercase text-emerald-700 bg-white border border-emerald-200 px-1.5 py-0.5 rounded-full"><i class="fas fa-arrow-up"></i> ĐANG THI</span>');
                    }else{
                        nameP.classList.remove('text-emerald-900');
                        nameP.classList.add('text-gray-900');
                    }
                }

                if(isPresent){
                    row.classList.add('bg-emerald-50/80','ring-1','ring-inset','ring-emerald-200');
                    const tbody=row.parentElement;
                    if(tbody && tbody.firstElementChild!==row) tbody.insertBefore(row,tbody.firstElementChild);
                }else{
                    row.classList.remove('bg-emerald-50/80','ring-1','ring-inset','ring-emerald-200');
                    // Khi bỏ có mặt cần phục hồi thứ tự chuẩn; render một lần là đủ.
                    requestAnimationFrame(()=>window.renderGradingTables?.());
                }
                return true;
            }
        }catch(e){ console.warn('FAST ATTENDANCE DOM PATCH:',e); }
        return false;
    };

    window._consumeAttendanceRealtimeEvent = function(data){
        if(!data?.candidateId) return;
