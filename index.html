        const eventKey=data.eventId || `${data.candidateId}_${data.attendanceOrder||0}_${data.isPresent?1:0}`;
        if(rt.lastAttendanceEvent.get(data.groupId)===eventKey) return;
        rt.lastAttendanceEvent.set(data.groupId,eventKey);

        const patched=window._patchAttendanceCache(data.candidateId, data.isPresent, data.attendanceOrder, data.updatedAt);
        if(!patched) return;

        // View bảng: cập nhật đúng row, không dựng lại cả DOM.
        if((window._gradingViewMode||'table')==='table' && window._selectedGradingGroupId===data.groupId){
            if(window._applyAttendanceDomFast(data.candidateId,!!data.isPresent)) return;
        }
        // View cá nhân / tab khác: gom render vào 1 frame duy nhất.
        if(!window._attendanceRenderRAF){
            window._attendanceRenderRAF=requestAnimationFrame(()=>{
                window._attendanceRenderRAF=null;
                window._rerenderGraderRealtime?.();
            });
        }
    };

    // Override Admin tick điểm danh: cập nhật local ngay + batch candidate + tín hiệu realtime nhẹ.
    window.toggleCandAttendance = async function(candId, isPresent) {
        const cand=(window._allCandidatesCache||[]).find(c=>c.id===candId);
        if(!cand) return window.showToast('Không tìm thấy thí sinh.','error');
        const oldPresent=window._attendanceValue(cand.isPresent);
        const oldOrder=Number(cand.attendanceOrder||0);
        const groupId=cand.groupId;
        const attendanceOrder=isPresent ? Date.now() : 0;
        const eventId=`${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;

        // Optimistic UI Admin: không chờ Firebase round-trip.
        cand.isPresent=!!isPresent;
        cand.attendanceOrder=attendanceOrder;
        try{ window._renderGradingUIInternal?.(); }catch(_e){}

        try{
            const batch=window.writeBatch(window.db);
            batch.set(window.doc(window.db,'candidates',candId),{
                isPresent:!!isPresent,
                attendanceOrder:isPresent?attendanceOrder:null,
                attendanceUpdatedAt:window.serverTimestamp()
            },{merge:true});
            if(groupId){
                batch.set(window.doc(window.db,'attendance_realtime',groupId),{
                    groupId,
                    candidateId:candId,
                    isPresent:!!isPresent,
                    attendanceOrder,
                    eventId,
                    updatedAt:window.serverTimestamp()
                },{merge:true});
            }
            await batch.commit();
        }catch(e){
            cand.isPresent=oldPresent;
            cand.attendanceOrder=oldOrder;
            try{ window._renderGradingUIInternal?.(); }catch(_e){}
            console.error('ATTENDANCE FAST WRITE:',e);
            window.showToast('Không đồng bộ được điểm danh: '+(e.code||e.message||'Lỗi Firebase'),'error');
        }
    };

    // Thay listener nhóm mở bằng phiên bản tối ưu docChanges + kênh attendance_realtime.
    window._startOpenGroupDataListeners = function(gid){
        const rt=window._graderRealtime;
        if(!rt.unsubCandidates.has(gid)){
            const q=window.query(window.collection(window.db,'candidates'),window.where('groupId','==',gid));
            let initialized=false;
            const u=window.onSnapshot(q,snap=>{
                let needsRender=!initialized;
                if(!initialized){
                    const others=(window._allCandidatesCache||[]).filter(x=>x.groupId!==gid), mine=[];
                    snap.forEach(ds=>{
                        const d={id:ds.id,...ds.data()};
                        const pending=rt.pendingAttendance.get(ds.id);
                        if(pending){
                            d.isPresent=pending.isPresent;
                            d.attendanceOrder=pending.attendanceOrder;
                            rt.pendingAttendance.delete(ds.id);
                        }
                        mine.push(d);
                    });
                    window._allCandidatesCache=others.concat(mine);
                    initialized=true;
                }else{
                    for(const change of snap.docChanges()){
                        const id=change.doc.id;
                        if(change.type==='removed'){
                            window._allCandidatesCache=(window._allCandidatesCache||[]).filter(x=>x.id!==id);
                            needsRender=true;
                            continue;
                        }
                        const incoming={id,...change.doc.data()};
                        const idx=(window._allCandidatesCache||[]).findIndex(x=>x.id===id);
                        if(idx<0){
                            window._allCandidatesCache.push(incoming);
                            needsRender=true;
                            continue;
                        }
                        const prev=window._allCandidatesCache[idx];
                        const onlyAttendanceChanged =
                            prev.name===incoming.name && prev.code===incoming.code && prev.groupId===incoming.groupId &&
                            JSON.stringify(prev.extraData||{})===JSON.stringify(incoming.extraData||{}) &&
                            window._attendanceValue(prev.isPresent)===window._attendanceValue(incoming.isPresent) &&
                            Number(prev.attendanceOrder||0)===Number(incoming.attendanceOrder||0);
                        window._allCandidatesCache[idx]={...prev,...incoming};
                        if(!onlyAttendanceChanged) needsRender=true;
                    }
                }
                if(needsRender) window._rerenderGraderRealtime();
            },err=>{
                console.warn('Realtime candidates error:',gid,err);
                if(err?.code==='permission-denied') window.showToast('Nhóm vừa bị khóa hoặc quyền vừa thay đổi.','error');
            });
            rt.unsubCandidates.set(gid,u);
        }

        if(!rt.unsubAttendance.has(gid)){
            const ref=window.doc(window.db,'attendance_realtime',gid);
            const u=window.onSnapshot(ref,snap=>{
                if(snap.exists()) window._consumeAttendanceRealtimeEvent({id:snap.id,...snap.data()});
            },err=>console.warn('Realtime attendance signal error:',gid,err));
            rt.unsubAttendance.set(gid,u);
        }

        if(!rt.unsubScores.has(gid)){
            const q=window.query(window.collection(window.db,'scores'),window.where('groupId','==',gid),window.where('graderCode','==',window.currentUserData.code));
            const u=window.onSnapshot(q,snap=>{
                const others=(window._allScoresCache||[]).filter(x=>x.groupId!==gid||x.graderCode!==window.currentUserData.code),mine=[];
                snap.forEach(ds=>{const d=ds.data();if(d.graderCode===window.currentUserData.code)mine.push({id:ds.id,...d});});
                window._allScoresCache=others.concat(mine);
                if(!document.activeElement?.classList?.contains('score-input')) window._rerenderGraderRealtime();
            },err=>console.warn('Realtime scores error:',gid,err));
            rt.unsubScores.set(gid,u);
        }

        if(!rt.unsubVerifications.has(gid)){
            const q=window.query(window.collection(window.db,'grader_verifications'),window.where('groupId','==',gid),window.where('graderCode','==',window.currentUserData.code));
            const u=window.onSnapshot(q,snap=>{
                const cache=Object.fromEntries(Object.entries(window._allVerificationsCache||{}).filter(([k,v])=>v.groupId!==gid||v.graderCode!==window.currentUserData.code));
                snap.forEach(ds=>{const d=ds.data();if(d.graderCode===window.currentUserData.code)cache[`${d.graderCode}_${d.groupId}`]={id:ds.id,...d};});
                window._allVerificationsCache=cache;
                window._rerenderGraderRealtime();
            },err=>console.warn('Realtime verification error:',gid,err));
            rt.unsubVerifications.set(gid,u);
        }
    };

    window._stopOpenGroupDataListeners = function(gid){
        const rt=window._graderRealtime;
        for(const map of [rt.unsubCandidates,rt.unsubAttendance,rt.unsubScores,rt.unsubVerifications]){
            try{map.get(gid)?.();}catch(_e){}
            map.delete(gid);
        }
        rt.lastAttendanceEvent.delete(gid);
        window._allCandidatesCache=(window._allCandidatesCache||[]).filter(x=>x.groupId!==gid);
        window._allScoresCache=(window._allScoresCache||[]).filter(x=>x.groupId!==gid);
        if(window._allVerificationsCache){
            for(const k of Object.keys(window._allVerificationsCache)) if(window._allVerificationsCache[k]?.groupId===gid) delete window._allVerificationsCache[k];
        }
    };
})();
</script>


<script type="module" id="v25-instant-assigned-groups">
(function(){
    // V25: Nhóm được phân quyền phải có mặt trong selector NGAY khi BGK vào trang.
    // Không hiển thị trạng thái "Đang tải thông tin nhóm..." nữa.

    window._groupNameCache = window._groupNameCache || {};
    try{
        const saved = JSON.parse(localStorage.getItem('gradeSyncGroupNameCache') || '{}');
        if(saved && typeof saved === 'object') window._groupNameCache = {...saved, ...window._groupNameCache};
    }catch(_e){}

    window._saveGroupNameCache = function(){
        try{ localStorage.setItem('gradeSyncGroupNameCache', JSON.stringify(window._groupNameCache || {})); }catch(_e){}
    };

    window._seedAssignedGroupNamesFromUser = function(){
        const meta = Array.isArray(window.currentUserData?.assignedGroupMeta) ? window.currentUserData.assignedGroupMeta : [];
        meta.forEach(x=>{
            if(x?.id && x?.name) window._groupNameCache[x.id] = x.name;
        });
        const names = window.currentUserData?.assignedGroupNames;
        if(names && typeof names === 'object'){
            Object.entries(names).forEach(([id,name])=>{ if(id && name) window._groupNameCache[id] = name; });
        }
        window._saveGroupNameCache();
    };

    window._preloadGraderAssignedGroups = async function(){
        if(window.currentUserData?.role !== 'Grader') return [];
        window._seedAssignedGroupNamesFromUser();

        const assigned = Array.isArray(window.currentUserData.assignedGroups) ? [...window.currentUserData.assignedGroups] : [];
        const rt = window._graderRealtime = window._graderRealtime || {};
        rt.groupState = rt.groupState || new Map();
        rt.assigned = assigned;

        if(!assigned.length){
            window._allowedGroupIdsCache = [];
            window._selectedGradingGroupId = null;
            return [];
        }

        // Seed selector ngay bằng metadata đã lưu cùng tài khoản/local cache.
        window._groupMapCache = window._groupMapCache || {};
        assigned.forEach(id=>{
            if(!window._groupMapCache[id]){
                window._groupMapCache[id] = {
                    id,
                    name: window._groupNameCache[id] || id,
                    __instantPlaceholder: true
                };
            }
        });
        window._allowedGroupIdsCache = [...assigned];
        if(!window._selectedGradingGroupId || !assigned.includes(window._selectedGradingGroupId)){
            window._selectedGradingGroupId = assigned[0];
        }

        // Lấy cấu hình thật của TẤT CẢ nhóm song song sau khi grader_session đã tồn tại.
        const results = await Promise.allSettled(
            assigned.map(async id=>{
                const snap = await window.getDoc(window.doc(window.db,'competition_groups',id));
                if(!snap.exists()) return null;
                return {id:snap.id, ...snap.data()};
            })
        );

        const valid = [];
        results.forEach((r,idx)=>{
            const id = assigned[idx];
            if(r.status === 'fulfilled' && r.value){
                const g = r.value;
                valid.push(id);
                window._groupMapCache[id] = g;
                rt.groupState.set(id,g);
                if(g.name) window._groupNameCache[id] = g.name;
            }else{
                // Vẫn giữ nhóm trong selector vì Admin đã phân quyền.
                // Listener realtime sẽ cập nhật khi Firestore sẵn sàng.
                valid.push(id);
            }
        });
        window._saveGroupNameCache();
        window._allowedGroupIdsCache = [...valid];
        if(!window._selectedGradingGroupId && valid.length) window._selectedGradingGroupId = valid[0];
        return valid;
    };

    // Selector không còn trạng thái "đang đồng bộ". Hễ assignedGroups có ID là hiển thị ngay.
    window.refreshGraderGroupSelector = function(){
        if(window.currentUserData?.role!=='Grader') return;
        const sel = document.getElementById('grading-group-select');
        if(!sel) return;

        window._seedAssignedGroupNamesFromUser();
        const assigned = Array.isArray(window._graderRealtime?.assigned)
            ? window._graderRealtime.assigned
            : (Array.isArray(window.currentUserData?.assignedGroups) ? window.currentUserData.assignedGroups : []);

        if(!assigned.length){
            sel.innerHTML = '<option value="">-- Chưa được phân quyền nhóm --</option>';
            sel.disabled = true;
            window._selectedGradingGroupId = null;
            const c=document.getElementById('grading-tables-container');
            if(c) c.innerHTML='<div class="bg-white p-10 rounded-2xl border border-gray-100 text-center"><i class="fas fa-lock text-3xl text-gray-400 mb-3"></i><h3 class="font-black text-gray-800">Chưa được phân quyền nhóm</h3><p class="text-xs text-gray-500 mt-2">Khi Admin cấp nhóm, danh sách sẽ xuất hiện tự động.</p></div>';
            return;
        }

        sel.disabled = false;
        const previous = window._selectedGradingGroupId;
        sel.innerHTML = assigned.map(id=>{
            const g = window._groupMapCache?.[id];
            const name = g?.name || window._groupNameCache?.[id] || id;
            let suffix = '';
            if(g && !g.__instantPlaceholder){
                suffix = window._isGroupGateOpenLocal?.(g) ? ' — ĐANG MỞ' : ' — CHƯA MỞ';
            }
            return `<option value="${id}">${window.escapeHtml(name)}${suffix}</option>`;
        }).join('');

        window._selectedGradingGroupId = assigned.includes(previous) ? previous : assigned[0];
        sel.value = window._selectedGradingGroupId;
    };

    // Mỗi nhóm mới được cấp: hiện ngay trong selector, rồi tải cấu hình thật song song.
    const _oldRefreshAssignedGroupSubscriptionsV25 = window.refreshAssignedGroupSubscriptions;
    window.refreshAssignedGroupSubscriptions = function(){
        const rt = window._graderRealtime;
        const assigned = Array.isArray(rt?.assigned) ? [...rt.assigned] : [];

        window._allowedGroupIdsCache = [...assigned];
        window._groupMapCache = window._groupMapCache || {};
        assigned.forEach(id=>{
            if(!window._groupMapCache[id]){
                window._groupMapCache[id] = {
                    id,
                    name: window._groupNameCache?.[id] || id,
                    __instantPlaceholder: true
                };
            }
        });
        if(!window._selectedGradingGroupId && assigned.length) window._selectedGradingGroupId = assigned[0];

        // Vẽ selector trước, không đợi snapshot.
        window.refreshGraderGroupSelector?.();

        const result = _oldRefreshAssignedGroupSubscriptionsV25 ? _oldRefreshAssignedGroupSubscriptionsV25() : undefined;

        // Direct fetch song song giúp nhóm mới được cấp có cấu hình nhanh hơn onSnapshot đầu tiên.
        assigned.forEach(id=>{
            const current = window._groupMapCache?.[id];
            if(current && !current.__instantPlaceholder) return;
            window.getDoc(window.doc(window.db,'competition_groups',id)).then(snap=>{
                if(!snap.exists()) return;
                const g={id:snap.id,...snap.data()};
                window._groupMapCache[id]=g;
                rt.groupState = rt.groupState || new Map();
                rt.groupState.set(id,g);
                if(g.name){
                    window._groupNameCache[id]=g.name;
                    window._saveGroupNameCache();
                }
                window.refreshGraderGroupSelector?.();
                window._syncGraderRealtimeGroups?.();
                window._rerenderGraderRealtime?.();
            }).catch(()=>{});
        });
        return result;
    };

    // Đăng nhập BGK: tạo session -> preload nhóm -> mới mở app.
    // Vì thế khi màn hình Bảng Điểm Live xuất hiện, selector đã có danh sách nhóm.
    window.handleLoginCode = async function(){
        const c=String(document.getElementById('login-code')?.value||'').trim().toUpperCase();
        if(!c) return window.showToast('Nhập mã giám khảo!','error');
        if(navigator.onLine===false) return window.showToast('Thiết bị đang mất mạng. Không thể xác thực mã giám khảo.','error');

        window._authFlow='grader-login';
        window.showLoading(true,'Đang vào hệ thống...');
        try{
            if(window.auth.currentUser){
                try{
                    if(window.currentUserData?.role==='Grader') await window.syncGraderSession(false,'switch-account');
                }catch(_){}
                await window.signOut(window.auth);
                await window.waitForAuthState(u=>!u,4000);
            }
            localStorage.removeItem('gradeSyncSession');

            const cred=await window.signInAnonymously(window.auth);
            const authUser=await window.waitForAuthState(u=>!!u&&u.isAnonymous,5000);
            if(!authUser?.isAnonymous) throw new Error('Không tạo được phiên Firebase Anonymous.');

            const q=window.query(window.collection(window.db,'users'),window.where('code','==',c),window.where('role','==','Grader'));
            const sp=await window.getDocs(q);
            if(sp.empty) throw new Error('GRADER_NOT_FOUND');
            const d=sp.docs[0].data();
            if(window.normalizeRole(d.role)!=='Grader') throw new Error('NOT_GRADER');
            if(window.isInactiveStatus(d.status)) throw new Error('GRADER_DISABLED');

            window.currentUserData={
                id:sp.docs[0].id,
                ...d,
                role:'Grader',
                status:d.status||'Active',
                assignedGroups:Array.isArray(d.assignedGroups)?d.assignedGroups:[],
                code:c
            };
            localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));
            window._seedAssignedGroupNamesFromUser();

            const sessionOK=await window.syncGraderSession(true,'login');
            if(!sessionOK) throw new Error('GRADER_SESSION_FAILED');

            // Quan trọng: preload nhóm trước initApp để không có màn "Đang đồng bộ nhóm".
            await window._preloadGraderAssignedGroups();

            window._lastInitAuthUid=cred.user.uid;
            window.initApp();
            window.showToast('Đăng nhập giám khảo thành công!');
        }catch(ex){
            console.error('GRADER LOGIN ERROR:',ex);
            window.showLoading(false);
            let msg='Không thể vào hệ thống: '+(ex.code||ex.message||'Lỗi không xác định');
            if(ex.message==='GRADER_NOT_FOUND') msg='Mã giám khảo không tồn tại.';
            else if(ex.message==='NOT_GRADER') msg='Mã này không phải tài khoản giám khảo.';
            else if(ex.message==='GRADER_DISABLED') msg='Thẻ giám khảo đang bị khóa.';
            else if(ex.message==='GRADER_SESSION_FAILED') msg='Không thể tạo phiên giám khảo. Hãy kiểm tra Firestore Rules.';
            window.showToast(msg,'error');
            try{await window.signOut(window.auth);}catch(_){}
        }finally{
            window._authFlow=null;
        }
    };

    // Khi trang Bảng Điểm Live được mở lại sau login/reload:
    // nếu cache chưa có thì preload trước khi render. Không dựng shell rỗng.
    const _oldLoadGradingTableV25 = window.loadGradingTable;
    window.loadGradingTable = async function(container){
        const isAdmin=['Admin','SuperAdmin'].includes(window.currentUserData?.role);
        if(isAdmin) return _oldLoadGradingTableV25(container);

        try{
            if(!window.currentUserData?.code) return window.renderErrorState(container,'Phiên đăng nhập không hợp lệ.');

            const assigned = Array.isArray(window.currentUserData.assignedGroups) ? window.currentUserData.assignedGroups : [];
            if(!assigned.length){
                if(!window._graderRealtime?.started) window.startGraderRealtime();
                window.renderGradingShell(container,false,'<option value="">-- Chưa được phân quyền nhóm --</option>');
                window.refreshGraderGroupSelector();
                window.startGroupContentClock();
                return;
            }

            // Nếu reload trang, đảm bảo session tồn tại rồi preload group trước khi vẽ giao diện.
            if(!window._graderRealtime?.started){
                // start realtime trước để quyền thay đổi sau này vẫn được nhận.
                window.startGraderRealtime();
            }

            const missing = assigned.some(id=>!window._groupMapCache?.[id] || window._groupMapCache[id].__instantPlaceholder);
            if(missing){
                await window._preloadGraderAssignedGroups();
            }

            const opts = assigned.map(id=>{
                const g=window._groupMapCache?.[id];
                const name=g?.name || window._groupNameCache?.[id] || id;
                const suffix=(g && !g.__instantPlaceholder)
                    ? (window._isGroupGateOpenLocal?.(g) ? ' — ĐANG MỞ' : ' — CHƯA MỞ')
                    : '';
                return `<option value="${id}">${window.escapeHtml(name)}${suffix}</option>`;
            }).join('');

            if(!window._selectedGradingGroupId || !assigned.includes(window._selectedGradingGroupId)){
                window._selectedGradingGroupId=assigned[0];
            }

            window.renderGradingShell(container,false,opts);
            const sel=document.getElementById('grading-group-select');
            if(sel){
                sel.value=window._selectedGradingGroupId;
                sel.disabled=false;
            }
            window.refreshGraderGroupSelector();
            window.startGroupContentClock();
            window.changeGradingGroup();
        }catch(e){
            console.error('V25 LOAD GRADING:',e);
            window.renderErrorState(container,e.message||String(e));
        }
    };

    // Admin lưu phân quyền kèm tên nhóm để lần đăng nhập sau BGK render selector tức thời.
    window.saveGraderEdit = async function(userId){
        const newName=document.getElementById('edit-grader-name-modal')?.value.trim();
        if(!newName) return window.showToast('Tên không được để trống!','error');

        const assignedGroups=[];
        document.querySelectorAll('.grader-edit-chk-modal:checked').forEach(chk=>assignedGroups.push(chk.value));
        const groups=window._groupsListCacheForModal||[];
        const assignedGroupMeta=assignedGroups.map(id=>{
            const g=groups.find(x=>x.id===id);
            return {id,name:g?.name||id};
        });
        const assignedGroupNames=Object.fromEntries(assignedGroupMeta.map(x=>[x.id,x.name]));

        window.closeCustomModal();
        window.showLoading(true,'Đang cập nhật phân quyền...');
        try{
            const ref=window.doc(window.db,'users',userId);
            const snap=await window.getDoc(ref);
            const oldVersion=snap.exists()?Number(snap.data()?.permissionsVersion||0):0;
            await window.setDoc(ref,{
                name:window.cleanTextForStore(newName),
                assignedGroups,
                assignedGroupMeta,
                assignedGroupNames,
                permissionsVersion:oldVersion+1,
                permissionsUpdatedAt:window.serverTimestamp(),
                updatedAt:window.serverTimestamp()
            },{merge:true});
            window.showToast('Đã cập nhật. BGK đang online sẽ thấy danh sách nhóm ngay.');
            await window.loadAccountManager(document.getElementById('main-content'));
        }catch(e){
            console.error('V25 SAVE GRADER:',e);
            window.showToast('Không thể cập nhật phân quyền: '+(e.message||e.code),'error');
        }finally{window.showLoading(false);}
    };

    window.createAccountByCode = async function(){
        const name=document.getElementById('acc-name')?.value.trim();
        const code=document.getElementById('acc-code')?.value.trim();
        if(!name||!code) return window.showToast('Vui lòng nhập tên','error');

        const assignedGroups=[];
        document.querySelectorAll('.acc-group-chk:checked').forEach(chk=>assignedGroups.push(chk.value));
        const groups=window._groupsListCacheForModal||[];
        const assignedGroupMeta=assignedGroups.map(id=>{
            const g=groups.find(x=>x.id===id);
            return {id,name:g?.name||id};
        });
        const assignedGroupNames=Object.fromEntries(assignedGroupMeta.map(x=>[x.id,x.name]));

        window.showLoading(true,'Đang đăng ký...');
        try{
            await window.addDoc(window.collection(window.db,'users'),{
                code:window.cleanTextForStore(code),
                name:window.cleanTextForStore(name),
                role:'Grader',
                status:'Active',
                assignedGroups,
                assignedGroupMeta,
                assignedGroupNames,
                permissionsVersion:1,
                permissionsUpdatedAt:window.serverTimestamp(),
                updatedAt:window.serverTimestamp()
            });
            window.showToast('Cấp thẻ ID thành công!');
            await window.loadAccountManager(document.getElementById('main-content'));
        }catch(e){
            window.showToast('Không thể tạo giám khảo: '+(e.message||e.code),'error');
        }finally{window.showLoading(false);}
    };
})();
</script>


<script type="module" id="v26-final-group-init">
(async()=>{
  const apply=()=>{
    if(window.currentUserData?.role!=='Grader') return;
    window._seedAssignedGroupPlaceholders?.();
    window.refreshGraderGroupSelector?.();
    const main=document.getElementById('main-content');
    if(main && document.getElementById('grading-group-select')){
      window.changeGradingGroup?.();
    }
  };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(apply,0),{once:true});
  else setTimeout(apply,0);
  setTimeout(apply,250);
})();
</script>

<script type="module" id="v27-system-hardening">
(function(){
    // ===== V27: canonical text handling =====
    window.decodeStoredText = function(value){
        if(value === null || value === undefined) return '';
        let s = String(value);
        const replacements = [
            [/&amp;/gi,'&'],[/&lt;/gi,'<'],[/&gt;/gi,'>'],[/&quot;/gi,'"'],[/&#0*39;|&apos;/gi,"'"]
        ];
        // Dữ liệu cũ có thể bị encode nhiều lần (&amp;amp;). Giải tối đa 4 lớp.
        for(let pass=0; pass<4; pass++){
            const before=s;
            replacements.forEach(([re,to])=>{ s=s.replace(re,to); });
            if(s===before) break;
        }
        return s;
    };
    window.cleanTextForStore = function(value){
        return window.decodeStoredText(value).replace(/[\u0000-\u001F\u007F]/g,' ').replace(/\s+/g,' ').trim();
    };
    const _rawEscape = function(value){
        if(value === null || value === undefined) return '';
        return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    };
    // Render legacy data safely without displaying &amp;amp;.
    window.escapeHtml = function(value){ return _rawEscape(window.decodeStoredText(value)); };

    // Clean cached names immediately so the grader selector is correct on first paint.
    try{
        if(window._groupNameCache){
            Object.keys(window._groupNameCache).forEach(k=>window._groupNameCache[k]=window.decodeStoredText(window._groupNameCache[k]));
            localStorage.setItem('gradeSyncGroupNameCache',JSON.stringify(window._groupNameCache));
        }
    }catch(_e){}

    // ===== V27: grader session maximum lifetime =====
    // Default: 2 hours. Change this single value if you want a different maximum login duration.
    window.GRADER_SESSION_MAX_MS = 2 * 60 * 60 * 1000;
    window.GRADER_SESSION_WARNING_MS = 5 * 60 * 1000;
    window._v27SessionWarningShown = false;

    const _originalLogoutV27 = window.handleLogout;
    window.handleLogout = async function(){
        try{
            localStorage.removeItem('gradeSyncGraderLoginAt');
            localStorage.removeItem('gradeSyncGraderSessionUserId');
        }catch(_e){}
        return _originalLogoutV27 ? _originalLogoutV27() : undefined;
    };

    window.ensureGraderSessionClock = function(){
        if(window.currentUserData?.role!=='Grader') return;
        const userId=String(window.currentUserData.id||window.currentUserData.code||'grader');
        let storedId='';
        try{storedId=localStorage.getItem('gradeSyncGraderSessionUserId')||'';}catch(_e){}
        if(storedId!==userId){
            try{
                localStorage.setItem('gradeSyncGraderSessionUserId',userId);
                localStorage.setItem('gradeSyncGraderLoginAt',String(Date.now()));
            }catch(_e){}
            window._v27SessionWarningShown=false;
        }
        let loginAt=0;
        try{loginAt=Number(localStorage.getItem('gradeSyncGraderLoginAt')||0);}catch(_e){}
        if(!loginAt){
            loginAt=Date.now();
            try{localStorage.setItem('gradeSyncGraderLoginAt',String(loginAt));}catch(_e){}
        }
        const elapsed=Date.now()-loginAt;
        const remain=window.GRADER_SESSION_MAX_MS-elapsed;
        if(remain<=0){
            window.showToast('Phiên giám khảo đã hết hạn. Hệ thống tự động đăng xuất để bảo mật.','error');
            setTimeout(()=>window.handleLogout(),100);
            return;
        }
        if(remain<=window.GRADER_SESSION_WARNING_MS && !window._v27SessionWarningShown){
            window._v27SessionWarningShown=true;
            const mins=Math.max(1,Math.ceil(remain/60000));
            window.showToast(`Phiên giám khảo sẽ tự đăng xuất sau khoảng ${mins} phút.`,'error');
        }
    };
    setInterval(()=>window.ensureGraderSessionClock(),30000);
    setTimeout(()=>window.ensureGraderSessionClock(),1000);

    // ===== V27: realtime self-repair =====
    window._v27RealtimeRepairTimer=null;
    window.scheduleRealtimeRepairV27=function(reason='realtime'){
        if(window.currentUserData?.role!=='Grader' || navigator.onLine===false) return;
        clearTimeout(window._v27RealtimeRepairTimer);
        window._v27RealtimeRepairTimer=setTimeout(async()=>{
            try{
                if(window.currentUserData?.id){
                    const u=await window.getDoc(window.doc(window.db,'users',window.currentUserData.id));
                    if(u.exists()){
                        const d=u.data()||{};
                        window.currentUserData={...window.currentUserData,...d,id:u.id,code:window.currentUserData.code||d.code};
                        if(window._graderRealtime) window._graderRealtime.assigned=Array.isArray(d.assignedGroups)?d.assignedGroups:[];
                        localStorage.setItem('gradeSyncSession',JSON.stringify(window.currentUserData));
                    }
                }
                await window.syncGraderSession?.(true,'v27-'+reason);
                window.refreshAssignedGroupSubscriptions?.();
                window.refreshGraderGroupSelector?.();
                window._rerenderGraderRealtime?.();
            }catch(e){console.warn('V27 REALTIME REPAIR:',reason,e);}
        },1200);
    };
    window.addEventListener('online',()=>window.scheduleRealtimeRepairV27('online'));

    // ===== V27: generic chunked cleanup helpers =====
    window._v27CommitOps = async function(ops,chunkSize=350){
        for(let i=0;i<ops.length;i+=chunkSize){
            const batch=window.writeBatch(window.db);
            ops.slice(i,i+chunkSize).forEach(op=>{
                if(op.type==='delete') batch.delete(op.ref);
                else if(op.type==='set') batch.set(op.ref,op.data,op.options||{merge:true});
            });
            await batch.commit();
        }
    };
    window._v27QueryDocs = async function(collectionName,field,value){
        const q=window.query(window.collection(window.db,collectionName),window.where(field,'==',value));
        const s=await window.getDocs(q);
        return s.docs;
    };

    window.deleteCandidateCascade = async function(candidateId){
        const candRef=window.doc(window.db,'candidates',candidateId);
        const candSnap=await window.getDoc(candRef);
        const cand=candSnap.exists()?candSnap.data():{};
        const [scores,logsById,legacyLogsByName]=await Promise.all([
            window._v27QueryDocs('scores','candidateId',candidateId),
            window._v27QueryDocs('audit_logs','candidateId',candidateId),
            cand.name ? window._v27QueryDocs('audit_logs','candidateName',cand.name) : Promise.resolve([])
        ]);
        const logMap=new Map();
        logsById.forEach(d=>logMap.set(d.id,d));
        legacyLogsByName.forEach(d=>{ const x=d.data()||{}; if(!cand.groupId || !x.groupId || x.groupId===cand.groupId) logMap.set(d.id,d); });
        const logs=[...logMap.values()];
        const ops=[{type:'delete',ref:candRef}];
        scores.forEach(d=>ops.push({type:'delete',ref:d.ref}));
        logs.forEach(d=>ops.push({type:'delete',ref:d.ref}));
        if(cand.groupId){
            try{
                const aRef=window.doc(window.db,'attendance_realtime',cand.groupId);
                const aSnap=await window.getDoc(aRef);
                if(aSnap.exists() && aSnap.data()?.candidateId===candidateId) ops.push({type:'delete',ref:aRef});
            }catch(_e){}
        }
        await window._v27CommitOps(ops);
        return {scores:scores.length,logs:logs.length};
    };

    window.deleteGroupCascade = async function(groupId){
        const groupRef=window.doc(window.db,'competition_groups',groupId);
        const groupSnap=await window.getDoc(groupRef);
        const groupData=groupSnap.exists()?groupSnap.data():{};
        const queries=await Promise.all([
            window._v27QueryDocs('candidates','groupId',groupId),
            window._v27QueryDocs('scores','groupId',groupId),
            window._v27QueryDocs('audit_logs','groupId',groupId),
            groupData.name ? window._v27QueryDocs('audit_logs','groupName',groupData.name) : Promise.resolve([]),
            window._v27QueryDocs('grader_verifications','groupId',groupId),
            window._v27QueryDocs('submission_notifications','groupId',groupId),
            window.getDocs(window.query(window.collection(window.db,'users'),window.where('assignedGroups','array-contains',groupId))),
            window.getDocs(window.query(window.collection(window.db,'grader_sessions'),window.where('assignedGroups','array-contains',groupId)))
        ]);
        const [candidates,scores,logsById,legacyLogsByName,verifications,notifications,userSnap,sessionSnap]=queries;
        const logMap=new Map();
        logsById.forEach(d=>logMap.set(d.id,d));
        legacyLogsByName.forEach(d=>logMap.set(d.id,d));
        const logs=[...logMap.values()];
        const ops=[];
        [candidates,scores,logs,verifications,notifications].forEach(list=>list.forEach(d=>ops.push({type:'delete',ref:d.ref})));
        ops.push({type:'delete',ref:groupRef});
        ops.push({type:'delete',ref:window.doc(window.db,'group_publication_index',groupId)});
        ops.push({type:'delete',ref:window.doc(window.db,'attendance_realtime',groupId)});

        userSnap.docs.forEach(d=>{
            const data=d.data()||{};
            const assigned=(data.assignedGroups||[]).filter(x=>x!==groupId);
            const meta=(data.assignedGroupMeta||[]).filter(x=>x?.id!==groupId);
            const names={...(data.assignedGroupNames||{})}; delete names[groupId];
            ops.push({type:'set',ref:d.ref,data:{assignedGroups:assigned,assignedGroupMeta:meta,assignedGroupNames:names,permissionsVersion:Number(data.permissionsVersion||0)+1,permissionsUpdatedAt:window.serverTimestamp(),updatedAt:window.serverTimestamp()},options:{merge:true}});
        });
        sessionSnap.docs.forEach(d=>{
            const data=d.data()||{};
            ops.push({type:'set',ref:d.ref,data:{assignedGroups:(data.assignedGroups||[]).filter(x=>x!==groupId),lastSeen:window.serverTimestamp(),reason:'group-deleted'},options:{merge:true}});
        });
        await window._v27CommitOps(ops);
        try{
            if(window._groupNameCache){delete window._groupNameCache[groupId];localStorage.setItem('gradeSyncGroupNameCache',JSON.stringify(window._groupNameCache));}
        }catch(_e){}
        return {candidates:candidates.length,scores:scores.length,logs:logs.length};
    };

    // Replace destructive actions so history/scores don't become orphans.
    window.deleteGroup=function(id){
        window.showCustomConfirm('Xóa nhóm này sẽ xóa luôn thí sinh, điểm, lịch sử truy vết, trạng thái nộp và gỡ phân quyền BGK. Tiếp tục?',async()=>{
            window.showLoading(true,'Đang xóa sạch dữ liệu nhóm...');
            try{
                const result=await window.deleteGroupCascade(id);
                window.showToast(`Đã xóa nhóm và dữ liệu liên quan (${result.candidates} thí sinh, ${result.scores} bảng điểm, ${result.logs} lịch sử).`);
                window.navigate('groups_manager',null,'QL Nhóm');
            }catch(e){console.error('DELETE GROUP CASCADE:',e);window.showToast('Không thể xóa sạch nhóm: '+(e.message||e.code),'error');}
            finally{window.showLoading(false);}
        });
    };

    window.dC=function(id){
        window.showCustomConfirm('Xóa thí sinh này? Điểm và lịch sử truy vết của thí sinh cũng sẽ bị xóa.',async()=>{
            window.showLoading(true,'Đang xóa thí sinh và lịch sử...');
            try{await window.deleteCandidateCascade(id);window.fRC?.();window.showToast('Đã xóa thí sinh, điểm và lịch sử liên quan.');}
            catch(e){console.error('DELETE CANDIDATE CASCADE:',e);window.showToast('Không thể xóa thí sinh: '+(e.message||e.code),'error');}
            finally{window.showLoading(false);}
        });
    };

    window.bDC=function(){
        const ids=[...document.querySelectorAll('.c-ck:checked')].map(x=>x.value).filter(Boolean);
        if(!ids.length) return;
        window.showCustomConfirm(`Xóa ${ids.length} thí sinh? Điểm và lịch sử liên quan cũng sẽ bị xóa.`,async()=>{
            window.showLoading(true,'Đang dọn dữ liệu liên quan...');
            try{
                for(const id of ids) await window.deleteCandidateCascade(id);
                window.fRC?.();window.showToast(`Đã xóa sạch dữ liệu của ${ids.length} thí sinh.`);
            }catch(e){console.error('BULK DELETE CASCADE:',e);window.showToast('Có lỗi khi xóa dữ liệu: '+(e.message||e.code),'error');}
            finally{window.showLoading(false);}
        });
    };

    // One-time legacy text repair for current database. Only Admin/SuperAdmin executes it.
    window.repairLegacyEncodedTextV27=async function(){
        if(!['Admin','SuperAdmin'].includes(window.currentUserData?.role)) return;
        if(localStorage.getItem('gradeSyncV27TextMigration')==='1') return;
        try{
            const [groups,cands,users]=await Promise.all([
                window.getDocs(window.collection(window.db,'competition_groups')),
                window.getDocs(window.collection(window.db,'candidates')),
                window.getDocs(window.collection(window.db,'users'))
            ]);
            const ops=[];
            groups.docs.forEach(d=>{
                const x=d.data()||{}; const name=window.cleanTextForStore(x.name||'');
                const criteria=(x.criteria||[]).map(c=>({...c,name:window.cleanTextForStore(c.name||'')}));
                const extraFields=(x.extraFields||[]).map(f=>({...f,name:window.cleanTextForStore(f.name||'')}));
                if(name!==x.name || JSON.stringify(criteria)!==JSON.stringify(x.criteria||[]) || JSON.stringify(extraFields)!==JSON.stringify(x.extraFields||[]))
                    ops.push({type:'set',ref:d.ref,data:{name,criteria,extraFields},options:{merge:true}});
            });
            cands.docs.forEach(d=>{
                const x=d.data()||{}; const name=window.cleanTextForStore(x.name||''); const code=window.cleanTextForStore(x.code||'');
                if(name!==x.name || code!==x.code) ops.push({type:'set',ref:d.ref,data:{name,code},options:{merge:true}});
            });
            users.docs.forEach(d=>{
                const x=d.data()||{}; const name=window.cleanTextForStore(x.name||''); const code=window.cleanTextForStore(x.code||'');
                const meta=(x.assignedGroupMeta||[]).map(m=>({...m,name:window.cleanTextForStore(m.name||'')}));
                const names={}; Object.entries(x.assignedGroupNames||{}).forEach(([k,v])=>names[k]=window.cleanTextForStore(v));
                const data={}; if(name!==x.name)data.name=name;if(code!==x.code)data.code=code;
                if(JSON.stringify(meta)!==JSON.stringify(x.assignedGroupMeta||[]))data.assignedGroupMeta=meta;
                if(JSON.stringify(names)!==JSON.stringify(x.assignedGroupNames||{}))data.assignedGroupNames=names;
                if(Object.keys(data).length) ops.push({type:'set',ref:d.ref,data,options:{merge:true}});
            });
            if(ops.length) await window._v27CommitOps(ops);
            localStorage.setItem('gradeSyncV27TextMigration','1');
            if(ops.length) console.info('V27 normalized legacy encoded text:',ops.length);
        }catch(e){console.warn('V27 TEXT MIGRATION:',e);}
    };

    // Hook initApp without blocking UI.
    const _initAppV27=window.initApp;
    window.initApp=function(){
        const r=_initAppV27?.apply(this,arguments);
        setTimeout(()=>{
            window.ensureGraderSessionClock();
            window.repairLegacyEncodedTextV27();
        },300);
        return r;
    };

    // Ensure long group names display correctly after all old modules have loaded.
    const _refreshSelectorV27=window.refreshGraderGroupSelector;
    window.refreshGraderGroupSelector=function(){
        const r=_refreshSelectorV27?.apply(this,arguments);
        const sel=document.getElementById('grading-group-select');
        if(sel){
            [...sel.options].forEach(o=>{o.textContent=window.decodeStoredText(o.textContent);});
            sel.title=window.decodeStoredText(sel.options[sel.selectedIndex]?.textContent||'');
        }
        return r;
    };
})();
</script>


<script>
(function(){
  const BUILD='V29.1-V27-STABLE';
  try {
    const prev=localStorage.getItem('gradeSyncBuild');
    if(prev!==BUILD){
      localStorage.setItem('gradeSyncBuild',BUILD);
      // Clear only transient UI caches from old experimental V28 builds. Keep Firebase/browser auth intact.
      ['gradeSyncGradingViewMode','gradeSyncV27TextMigration','gradeSyncV28TextMigration','gradeSyncLastView','gradeSyncSelectedGroup'].forEach(k=>{try{localStorage.removeItem(k)}catch(_e){}});
    }
  } catch(_e){}

  window.resetGradeSyncClient = async function(){
    const proceed = window.confirm('Đặt lại phiên GradeSync trên trình duyệt này? Dữ liệu Firestore và điểm đã lưu sẽ KHÔNG bị xóa.');
    if(!proceed) return;
    try{
      if(window.stopGraderPresenceHeartbeat) window.stopGraderPresenceHeartbeat();
      if(window.stopAdminPresenceWatch) window.stopAdminPresenceWatch();
      if(window.stopGraderRealtime) window.stopGraderRealtime();
      if(window.clearRealtimeListeners) window.clearRealtimeListeners();
    }catch(_e){}
    try{ if(window.auth && window.signOut) await window.signOut(window.auth); }catch(_e){}
    try{
      Object.keys(localStorage).forEach(k=>{
        if(k.startsWith('gradeSync')) localStorage.removeItem(k);
      });
      Object.keys(sessionStorage).forEach(k=>{
        if(k.startsWith('gradeSync')) sessionStorage.removeItem(k);
      });
    }catch(_e){}
    location.replace(location.pathname+'?v='+Date.now());
  };
})();
</script>
