<!DOCTYPE html>
<html lang="vi"><head>
<link rel="stylesheet" href="/osc-appearance.css?v=20261126">
<script src="/osc-appearance.js?v=20261126"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Tra cứu kết quả casting | Our Stage</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#331d28;background:#faf7f9}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
main{background:#fff;border:1px solid #ebdae3;border-radius:24px;box-shadow:0 16px 55px #3c142915;padding:32px;width:min(100%,480px)}
.logo{background:linear-gradient(130deg,#7a1837,#381727);width:52px;height:52px;border-radius:16px;color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;margin-bottom:18px}
h1{font-size:23px;margin:0 0 7px}p{color:#735b67;font-size:13px;line-height:1.6}label{display:block;font-size:13px;font-weight:700;margin:15px 0 5px}
input{width:100%;border:1px solid #deccd5;border-radius:11px;padding:12px;font:inherit;font-size:14px;outline:none}
input:focus{border-color:#7a1837;box-shadow:0 0 0 3px #7a183720}
button{width:100%;padding:13px;margin-top:18px;background:#7a1837;color:white;border:0;border-radius:11px;font-weight:750;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}#result{margin-top:15px;font-size:14px;font-weight:600}#result:not(:empty){border:1px solid #e4d6dd;border-radius:12px;padding:14px}
small{color:#86717d}
</style></head><body>
<main><div class="logo">OS</div><h1>Tra cứu kết quả casting</h1>
<p>Kết quả chỉ hiển thị sau thời điểm công bố và khi thông tin cá nhân khớp với hồ sơ thí sinh.</p>
<form id="lookup"><label for="code">Số báo danh hoặc MSSV</label><input id="code" name="code" autocomplete="off" maxlength="50" required>
<label for="email">Email đã đăng ký</label><input id="email" type="email" name="email" autocomplete="email" maxlength="254" required>
<button type="submit">Tra cứu kết quả</button></form><div id="result" role="status" aria-live="polite"></div>
<p><small>Không chia sẻ mã và thông tin cá nhân của người khác. Kết quả cần được BCN phê duyệt trước khi công bố.</small></p></main>
<script>
const form=document.getElementById("lookup"),out=document.getElementById("result"),params=new URLSearchParams(location.search);
form.addEventListener("submit",async e=>{
 e.preventDefault();out.textContent="";
 const castingId=params.get("casting")||"";
 if(!/^[0-9a-f-]{36}$/i.test(castingId)){out.textContent="Liên kết casting không hợp lệ.";return}
 const button=form.querySelector("button");button.disabled=true;button.textContent="Đang tra cứu...";
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);
  let response;
  try{response=await fetch("/api/casting-public",{method:"POST",cache:"no-store",signal:controller.signal,
    headers:{"Content-Type":"application/json"},body:JSON.stringify({castingId,code:form.code.value,email:form.email.value})});
  }finally{clearTimeout(timer)}
  const data=await response.json().catch(()=>({}));
  if(!response.ok||!data.ok)throw Error(data.error||"Không tìm thấy kết quả.");
  const result=data.result||{};
  out.replaceChildren();
  for(const value of ["SBD: "+(result.code||"—"),result.name?"Thí sinh: "+result.name:null,
   result.score!=null?"Điểm: "+result.score:null,result.outcome?"Kết quả: "+(result.outcome==="passed"?"ĐẠT":"KHÔNG ĐẠT"):null].filter(Boolean)){
    const p=document.createElement("p");p.textContent=value;out.append(p);
  }
 }catch(err){out.textContent=err.message}
 finally{button.disabled=false;button.textContent="Tra cứu kết quả"}
});
</script></body></html>
