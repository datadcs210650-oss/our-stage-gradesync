<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Nền tảng chấm điểm | Dự phòng</title><link rel="stylesheet" href="/backup.css"><script defer src="/backup.js"></script></head><body><header><div><small>OUR STAGE CLUB</small><h1>NỀN TẢNG CHẤM ĐIỂM</h1><p>Cổng truy cập dự phòng</p></div><button id="logout" hidden>Đăng xuất</button></header><main><section id="login"><h2>Đăng nhập giám khảo</h2><p>Sử dụng mã BGK và mã truy cập riêng do Ban Chủ nhiệm cấp.</p><form id="loginform"><label>Mã giám khảo<input id="code" required autocomplete="username" maxlength="20"></label><label>Mã truy cập<input id="secret" required autocomplete="current-password" type="password" maxlength="32"></label><button type="submit">Đăng nhập</button></form></section><section id="work" hidden><div class="toolbar"><strong id="judge"></strong><label>Phiên chấm<select id="groups"></select></label><button id="reload">Tải lại</button><button id="save">Lưu điểm</button><button id="submit">Nộp bảng điểm</button></div><p id="state"></p><div id="table" class="scroll"></div><p class="hint">Ô bỏ trống là chưa chấm, không phải điểm 0. Hãy lưu trước khi nộp.</p></section><p id="message" role="status" aria-live="polite"></p><dialog id="confirm"><h2>Xác nhận nộp bảng điểm</h2><p id="summary"></p><label class="check"><input type="checkbox" id="accept"> Tôi đã kiểm tra và đồng ý khóa bảng điểm.</label><div class="toolbar"><button id="cancel">Hủy</button><button id="final">Xác nhận nộp</button></div></dialog></main><footer>OSC · Cổng dự phòng chỉ dùng khi được cấp quyền.</footer></body></html>
